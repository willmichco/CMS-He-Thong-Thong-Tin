  const fSeries = [{name: "Tin pháp lý", color: "var(--s1)"}, {name: "Bài đối thủ", color: "var(--s2)"}];
  const top = props.slice().sort(byHeat).slice(0, 5);
  // thu về: tin theo dạng tin (bản chất nội dung); trả ra: đề xuất viết theo dạng bài (giọng văn). Hiện 8 dạng nhiều

  if(kRest.length) kRows.push({label: `${kRest.length} dạng khác`, vals: [kRest.reduce((a, k) => a + kc[k], 0)], colors: ["var(--neutral)"], tip: kRest.map(k => ((D.dang_tin || {})[k] || {}).ten || k).join(", ")});
  const kSeries = Object.entries(D.nhom_dang_tin || {}).map(([g, name]) => ({name, color: KIND_COLOR[g] || "var(--neutral)"}));
  const fc = countBy(props.filter(it => it.dang_bai && it.dang_bai !== "khong_viet"), it => it.dang_bai);
  const fKeysB = Object.keys(fc).sort((a, b) => fc[b] - fc[a]);
  const bRows = fKeysB.map(k => ({label: ((D.dang_bai || {})[k] || {}).ten || k, vals: [fc[k]], go: "bai:" + k}));
  const lastRun = (NK.luot || [])[0];
  const stc = countBy(D.nguon || [], srcState);
  const qToday = aiDay(T), qNext = aiDay(addDays(T, 1));
  const showA = S.ov ? S.ov === "on" : innerWidth > 1024;
  const hr = vnParts(Date.now()).h, hello = hr < 11 ? "Chào buổi sáng" : hr < 13 ? "Chào buổi trưa" : hr < 18 ? "Chào buổi chiều" : "Chào buổi tối";

  return `<div class="hero"><div><h1>${hello}${ME ? ", " + esc(ME) : ""}</h1><p>${WD[wdOf(T)]}, ${vnDate(T)} · ${todos.length ? `${nf(todos.length)} việc${urgent ? `, ${nf(urgent)} việc gấp` : ""}` : "không có việc gấp"} · ${nf(D.items.length)} tin trong kho 90 ngày</p></div>
      <div class="hero-st">${freshness()}${editedToday() ? pill("good", "Đã qua AI biên tập") : pill("warn", "Chưa biên tập")}</div></div>
    <div class="grid">
      <div class="c7 stack"><div class="o1">${card("Việc cần làm", "Xếp theo mức gấp · bấm để xử lý",
        todos.length ? `<div class="todo">${todos.map(([c, i, t, s, attrs, act]) => `<button class="todo-i ${c}" type="button" ${attrs}><span class="ti">${ic(i)}</span>
          <span class="tt"><b>${esc(t)}</b><span>${esc(s)}</span></span><span class="go">${esc(act || "Xem")}${ic("arrow", 15)}</span></button>`).join("")}</div>`
          : `<div class="all-clear">${ic("check")}Không có việc gì cần xử lý. Hệ thống chạy bình thường.</div>`, {flush: true})}</div>
        <div class="o3">${card("Văn bản sắp có hiệu lực", "30 ngày tới · ngày hiệu lực lấy từ văn bản gốc",
        soon.length ? `<div class="list">${soon.slice(0, 6).map(docRow).join("")}</div>` : empty("Chưa ghi nhận văn bản nào có hiệu lực trong 30 ngày tới.", "cal"),
        {flush: true, acts: `<button class="mini-btn" type="button" data-tab="van-ban">Lịch hiệu lực</button>`})}</div>
        <div class="o4">${card("Tình trạng hệ thống", lastRun ? `Lượt quét gần nhất ${hm(lastRun.luot)} ngày ${dm(lastRun.ngay)}` : "Chưa có lượt quét",
        `<div style="display:grid;gap:14px">
          <div><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px"><span>Nguồn, theo lượt gần nhất</span><span class="muted">${nf((D.nguon || []).length)} nguồn</span></div>
            ${stackbar(Object.keys(SRC_ST).map(k => ({name: SRC_ST[k][1], v: stc[k] || 0, color: STATUS_VAR[SRC_ST[k][0]]})))}
            <div class="legend" style="margin:8px 0 0">${Object.keys(SRC_ST).filter(k => stc[k]).map(k => `<span>${pill(SRC_ST[k][0], SRC_ST[k][1] + " " + stc[k])}</span>`).join("")}</div></div>
          <div class="facts"><dt>Hàng đợi AI hôm nay</dt><dd>${qToday ? `${nf(qToday.so_viec)} việc · ${aiSummary(qToday)}` : "Không có"}</dd>
            <dt>Hàng đợi sáng mai</dt><dd>${qNext ? `${nf(qNext.so_viec)} / ${nf(NK.hang_doi_toi_da)} việc` : "Chưa có"}</dd>
            <dt>Tin bị máy loại hôm nay</dt><dd>${(() => { const l = (NK.loc || []).find(x => x.ngay === T); return l ? `${nf(Object.values(l.loai_bo || {}).reduce((a, b) => a + b, 0))} tin (nhiễu, không phải tin pháp lý)` : "–"; })()}</dd></div>
        </div>`, {acts: `<button class="mini-btn" type="button" data-tab="quet-ai">Chi tiết</button>`})}</div>
      </div>
      <div class="c5 stack"><div class="o2">${card("Nên viết hôm nay", `${nf(props.length)} đề xuất trong 7 ngày, xếp theo độ nóng`,
        top.length ? `<div class="list">${top.map(it => `<div class="li click" role="button" tabindex="0" data-pick="${esc(it.id)}"><div class="main"><div class="ttl">${esc(it.y_tuong ? it.y_tuong.tieu_de_web : it.tieu_de)}</div>
          <div class="meta">${groupTag(it)} ${esc(fields(it))} · ${esc(it.nguon)}${it.so_nguon > 1 ? ` · ${it.so_nguon} nguồn` : ""}</div></div>
          <div class="side-r">${heat(it.diem_nong)}${it.khoang_trong === true ? pill("warn", "Đối thủ chưa viết") : ""}</div></div>`).join("")}</div>` : empty("Chưa có đề xuất mới.", "pen"),
        {flush: true, acts: `<button class="mini-btn" type="button" data-tab="goi-y" data-reset="goi">Tất cả</button>`})}</div>
      </div>
    </div>
    <div class="kpis" style="margin-top:16px">
      ${kpi("kho", "box", "Tin mới hôm nay", nf(today.length), `<span class="sub">${delta === null ? "Chưa có số liệu hôm qua" : partial ? `${nf(runsT)} lượt quét hôm nay · hôm qua ${nf(yest.length)} tin` : `<span class="delta ${delta >= 0 ? "up" : "down"}">${delta >= 0 ? "▲ +" : "▼ "}${nf(delta)}</span> so với hôm qua`}</span>`, spark(days(14).map(d => D.items.filter(it => it.ngay_thu === d).length)))}
      ${kpi("goi-y", "pen", "Đề xuất viết", nf(props.length), `<span class="sub">7 ngày · ${nf(gaps.length)} chủ đề đối thủ chưa viết</span>`, "", "", ' data-reset="goi"')}
      ${kpi("van-ban", "cal", "Sắp có hiệu lực", nf(soon.length), `<span class="sub">${soon.length ? `30 ngày tới · gần nhất ${dm(soon[0].hieu_luc)}, còn ${dayDiff(T, soon[0].hieu_luc)} ngày` : "30 ngày tới · chưa ghi nhận văn bản nào"}</span>`, "", eff0.length || eff7.length ? "attn" : "")}
      ${kpi("doi-thu", "eye", "Bài đối thủ", nf(posts7.length), `<span class="sub">7 ngày · từ ${nf(units7)} đơn vị</span>`, spark(postsDay))}
      ${kpi("quet-ai", "ai", "AI đã biên tập", `${nf(edited)}<small> / ${nf(deep.length)}</small>`, `<div class="meter" title="${pct(edited, deep.length)}%"><span style="width:${pct(edited, deep.length)}%"></span></div><span class="sub">7 ngày · tin đọc sâu hoặc đề xuất viết</span>`, "", "", ' data-sub="ai"')}
      ${kpi("quet-ai", "cpu", "Nguồn hoạt động", `${nf(okSrc)}<small> / ${nf(act.length)}</small>`, `<span class="sub">${badSrc.length ? pill("crit", badSrc.length + " nguồn lỗi") : pill("good", "Không có nguồn lỗi")}</span>`, "", badSrc.length ? "bad" : "", ' data-sub="nguon"')}
    </div>
    <div class="sec-h"><div><h2>Phân tích</h2><p>Tin thu về, phân luồng, lĩnh vực và dạng bài · ${R} ngày</p></div><span class="sp"></span>
      ${showA ? seg("range", R, [[7, "7 ngày"], [14, "14 ngày"], [30, "30 ngày"], [90, "90 ngày"]]) : ""}
      <button class="mini-btn" type="button" data-ov aria-expanded="${showA}">${showA ? "Thu gọn" : "Hiện biểu đồ"}</button></div>
    ${showA ? `<div class="grid">
      <div class="c8">${chartCard("ov-col", "Tin thu được theo ngày", `${R} ngày gần nhất, theo loại nguồn · ${nf(inRange.length)} tin`,
        legend(loaiSeries) + colChart({cats: dl.map(d => ({label: dm(d), tip: WD[wdOf(d)] + ", " + vnDate(d)})), series: loaiSeries, vals: colVals, h: 230, label: "Tin thu được theo ngày"}),
        ["Ngày", ...loaiSeries.map(s => s.name), "Tổng"], dl.map((d, i) => [vnDate(d), ...colVals[i].map(nf), nf(colVals[i].reduce((a, b) => a + b, 0))]))}</div>
      <div class="c4">${chartCard("ov-lane", "Phân luồng", `Máy chấm điểm sơ bộ 0–10 rồi chia luồng · ${R} ngày`,
        donut([{name: "Đọc sâu", v: lu.doc_sau || 0, color: "var(--o1)"},
               {name: "Đọc nông", v: lu.doc_nong || 0, color: "var(--o2)"}, {name: "Lưu kho", v: lu.luu_kho || 0, color: "var(--o3)"}], nf(inRange.length), "tin") +
        `<p class="note">Đọc sâu (từ ${(NK.phan_luong || {}).doc_sau_tu || 5} điểm): AI tóm tắt, chấm phạm vi ảnh hưởng và gợi ý bài. Đọc nông: chỉ hiện tiêu đề. Lưu kho: giữ để tra cứu.</p>`,
        ["Luồng", "Số tin", "Tỷ lệ"], ["doc_sau", "doc_nong", "luu_kho"].map(k => [LUONG[k], nf(lu[k] || 0), pct(lu[k] || 0, inRange.length) + "%"]))}</div>
      <div class="c7">${chartCard("ov-field", "Lĩnh vực: tin pháp lý và bài đối thủ", `${R} ngày · 10 lĩnh vực nhiều tin nhất. Nhiều tin mà ít bài đối thủ là chỗ dễ có thứ hạng tìm kiếm.`,
        legend(fSeries) + hbars(fRows.map((r, i) => ({...r, go: "kho:" + fKeys[i]})), fSeries, {empty: "Chưa có tin nào được gán lĩnh vực."}),
        ["Lĩnh vực", "Tin pháp lý", "Bài đối thủ"], fRows.map(r => [r.label, nf(r.vals[0]), nf(r.vals[1])]))}</div>
      <div class="c5">${chartCard("ov-fmt", "Trả ra: đề xuất viết theo dạng bài", `7 ngày · ${nf(props.length)} đề xuất. Mỗi dạng bài một giọng văn; bấm để lọc ở Gợi ý viết.`,
        hbars(bRows, [{name: "Đề xuất", color: "var(--s3)"}], {share: true, empty: "Chưa có đề xuất mới."}),
        ["Dạng bài", "Đề xuất"], fKeysB.map(k => [((D.dang_bai || {})[k] || {}).ten || k, nf(fc[k])]))}</div>
      <div class="c12">${chartCard("ov-kind", "Thu về: tin theo dạng tin", `${R} ngày · theo bản chất nội dung, không theo nguồn. Bấm một dòng để xem trong Kho tin.`,
        legend(kSeries) + hbars(kRows, [{name: "Số tin", color: "var(--s1)"}], {share: true, empty: "Chưa có tin nào."}),
        ["Dạng tin", "Nhóm", "Số tin"], kKeys.map(k => { const d = (D.dang_tin || {})[k] || {}; return [d.ten || k, (D.nhom_dang_tin || {})[d.nhom] || "", nf(kc[k])]; }))}</div>
    </div>` : ""}`;
}
function aiSummary(d){
  const st = d.theo_trang_thai || {};
  return Object.keys(AI_ST).filter(k => st[k]).map(k => AI_ST[k][1].toLowerCase() + " " + st[k]).join(", ") || "chưa có kết quả";
}
function docRow(it){
  const n = dayDiff(D.ngay, it.hieu_luc);
  return `<div class="li click" role="button" tabindex="0" data-open="item:${esc(it.id)}" title="Bấm để xem hiệu lực, căn cứ và nội dung văn bản"><div class="datebox"><b>${dm(it.hieu_luc)}</b><span>${WDS[wdOf(it.hieu_luc)]}</span></div>
    <div class="main"><div class="ttl">${esc(it.tieu_de)}</div><div class="meta">${(it.so_hieu || []).length ? `<span class="num">${esc(it.so_hieu.join(", "))}</span> · ` : ""}${esc(it.nguon)} · ${esc(fields(it))}${it.hieu_luc_ghi_chu ? ` · ${esc(it.hieu_luc_ghi_chu)}` : ""}</div></div>
    <div class="side-r">${countdown(it.hieu_luc)}${n >= 0 ? kiemChung(it) : ""}</div></div>`;
}

// ---------- tab: Gợi ý viết ----------
function vIdeas(){
  const G = S.goi, q = fold(G.q);
  const all = proposals(G.days);
  const rows = all.filter(it => (!G.tt || it.trang_thai === G.tt) && (!G.nhom || groupOf(it) === G.nhom) && (!G.bai || it.dang_bai === G.bai) && (!G.gap || it.khoang_trong === true)
      && (!q || fold(it.tieu_de + " " + (it.y_tuong ? it.y_tuong.tieu_de_web + " " + (it.y_tuong.tu_khoa || []).join(" ") : "") + " " + (it.so_hieu || []).join(" ")).includes(q)))
    .sort(byHeat);
  if(G.pin){ const it = D.items.find(x => x.id === G.pin); if(it && !rows.includes(it)) rows.unshift(it); G.pin = null; }
  if(G.sel && !rows.some(it => it.id === G.sel)) G.sel = null;
  if(!G.sel && !G.closed && rows.length && innerWidth > 1024) G.sel = rows[0].id;
  const pick = G.sel ? rows.find(it => it.id === G.sel) : null;
  const groups = ["A", "B", "tin_tuc"].map(g => [g, rows.filter(it => groupOf(it) === g)]).filter(([, l]) => l.length);
  IDEA_ROWS = groups.flatMap(([, l]) => l.map(it => it.id));   // thứ tự như trên màn hình, cho nút và phím tin trước, sau

// Sổ quét cộng dồn (data/so-quet.json, giữ vĩnh viễn): ky = số ngày gần nhất, 0 là từ ngày đầu
const SQ_KY = [[1, "Hôm nay"], [7, "7 ngày"], [30, "30 ngày"], [0, "Từ đầu"]];
const LOAI_BO = {nhieu: "Nhiễu (quảng cáo, tin rác)", khong_phap_ly: "Không phải tin pháp lý", thieu_tu_khoa: "Thiếu từ khóa bắt buộc của nguồn"};
const SQ_MAU = {da_thay: "var(--neutral)", bi_loai: "var(--crit)", moi: "var(--s3)", ai: "#f08a3c"};
function sqDays(ky){
  const N = (D.so_quet || {}).ngay || {};
  return Object.keys(N).sort().filter(d => !ky || dayDiff(d, D.ngay) < ky).map(d => ({ngay: d, ...N[d]}));
}
function sqSum(days){
  const K = ["luot", "doc_nguon", "loi", "rong", "doc_duoc", "da_thay", "bi_loai", "moi", "vao_kho", "dt_doc", "dt_moi"];
  const t = {ngay: 0, ai_viec: 0, ai_doc: 0, ai_tin: 0, ai_vao_kho: 0, loai_bo: {}, nguon: {}, ai_nguon: {}};
  K.forEach(k => t[k] = 0);
  const add = (into, key, v) => { const r = into[key] || (into[key] = v.map(() => 0)); v.forEach((x, i) => r[i] += x); };
  days.forEach(d => {
    if(d.luot) t.ngay++;
    K.forEach(k => t[k] += d[k] || 0);
    const a = d.ai || {};
    t.ai_viec += a.viec || 0; t.ai_doc += a.doc || 0; t.ai_tin += a.tin || 0; t.ai_vao_kho += a.vao_kho || 0;
    Object.entries(d.loai_bo || {}).forEach(([k, v]) => t.loai_bo[k] = (t.loai_bo[k] || 0) + v);
    Object.entries(d.nguon || {}).forEach(([k, v]) => add(t.nguon, k, v));
    Object.entries(a.nguon || {}).forEach(([k, v]) => add(t.ai_nguon, k, v));
  });
  return t;
}
const sqKyTxt = ky => ky ? (SQ_KY.find(k => k[0] === ky) || [, ky + " ngày"])[1].toLowerCase() : "từ " + dm((D.so_quet || {}).bat_dau || D.ngay);
function sqTile(lab, val, sub, color){
  return `<div class="kpi"><span class="lab">${color ? `<i class="sq-dot" style="background:${color}"></i>` : ""}${lab}</span><span class="val">${val}</span><span class="sub">${sub}</span></div>`;
}
function scanTotals(){
  const ky = S.ai.ky, days = sqDays(ky), t = sqSum(days);
  if(!days.length) return card("Tổng số liệu quét", "", empty("Sổ quét chưa có ngày nào. Số liệu có sau lượt thu tin kế tiếp."));
  const ok = t.doc_nguon - t.loi - t.rong, chuaThay = t.bi_loai + t.moi;
  const reasons = Object.entries(t.loai_bo).sort((a, b) => b[1] - a[1]);

  else if(failed.includes("ghep")) out.ghep = {s: "loi", now: `Dừng giữa chừng, ${dur(minsAgo(L.cap_nhat))} trước`, stats: gStats};
  else if(q && q.co_ket_qua && !q.da_ghep) out.ghep = {s: "cho", now: "AI đã nộp kết quả, chờ lượt ghép", stats: gStats};
  else out.ghep = {s: "ngu", now: sleep(nextRun(["08:52"]), q && q.da_ghep ? "Đã ghép hàng đợi hôm nay" : "Dậy ngay khi AI nộp kết quả"), stats: gStats};

  const xStats = [["Bản đang xem", hm(D.tao_luc)], ["Tin trong kho", nf(D.items.length)]];
  const newer = L.tao_luc && L.tao_luc > D.tao_luc;
  if(running.includes("xuat")) out.xuat = {s: "lam", now: `Đang mã hóa và đẩy bản mới · ${dur(minsAgo(since))}`, stats: xStats};
  else if(failed.includes("xuat")) out.xuat = {s: "loi", now: `Xuất bản lỗi, ${dur(minsAgo(L.cap_nhat))} trước`, stats: xStats};
  else if(minsAgo(L.tao_luc || D.tao_luc) < 20) out.xuat = {s: "xong", now: `Vừa đẩy bản ${hm(L.tao_luc || D.tao_luc)}${newer ? ", tải lại để xem" : ""}`, stats: xStats};
  else out.xuat = {s: "ngu", now: sleep(nextRun([...COLLECT_AT, "08:52"]), "Chạy sau mỗi lượt thu tin, ghép, hoặc khi đổi code"), stats: xStats};

  const aiLate = out.ai.s === "loi";
  out.gac = {s: "ngu", now: sleep(nextRun(["09:22"]), "Mỗi sáng kiểm tra AI và các nguồn"), warn: longBad ? `${longBad} nguồn lỗi từ 3 ngày` : aiLate ? "AI chưa nộp" : "",
    stats: [["Nguồn lỗi ≥ 3 ngày", nf(longBad)], ["Lỗi lượt cuối", nf(bad(src))]]};

  const a = D.kiem_tra_nhan || {};
  out.hoc = {s: "ngu", now: sleep(nextRun(["06:45"], 1), "Mỗi thứ Hai đề xuất từ khóa tuần"),
    stats: [["Nhãn đối thủ khớp", a.so_bai ? pct(a.khop, a.so_bai) + "%" : "–"], ["Bài bỏ sót", nf((a.bo_sot || []).length)]]};
  return out;
}

// ---------- toàn cảnh: phòng máy và phòng nghỉ AI, góc nhìn chéo vẽ bằng SVG ----------
// Toạ độ tính theo ô: x dọc tường sau, y dọc tường trái, z chiều cao. Phòng máy x 0..MX, y 0..RH; phòng nghỉ nằm bên
// phải, lùi vào trong (y -RB..RF). Bot rảnh ngồi sạc ở ghế ngả phòng nghỉ; được giao việc thì đứng dậy, đi sang bàn.
const MX = 9.6, RH = 10, RX1 = 22.2, RB = 3.4, RF = 3.7, WH = 3.6, WT = 0.22, U = 46, CA = 0.9135, SA = 0.4067;
const OX = 448, OY = 200, SVGNS = "http://www.w3.org/2000/svg";
const IP = (x, y, z = 0) => [OX + (x - y) * CA * U, OY + (x + y) * SA * U - z * U];
const f1 = v => v.toFixed(1);
const ipts = a => a.map(p => f1(p[0]) + "," + f1(p[1])).join(" ");
const poly = (a, attrs = "") => `<polygon points="${ipts(a)}" ${attrs}/>`;
const iseg = (a, b) => `M${f1(a[0])} ${f1(a[1])}L${f1(b[0])} ${f1(b[1])}`;
const tr = p => `translate(${f1(p[0])} ${f1(p[1])})`;
const onY = p => `matrix(${CA} ${SA} 0 1 ${f1(p[0])} ${f1(p[1])})`;     // mặt song song trục x: tường sau, mặt hông bàn
const onX = p => `matrix(${CA} ${-SA} 0 1 ${f1(p[0])} ${f1(p[1])})`;    // mặt song song trục y: tường trái, màn hình bàn
const onF = p => `matrix(${CA} ${SA} ${-CA} ${SA} ${f1(p[0])} ${f1(p[1])})`;   // mặt sàn
const shadeC = (c, k) => `color-mix(in srgb,${c} ${k}%,#000)`;
function box(x, y, z, w, d, h, c, cls = ""){
  return `<g class="bx ${cls}">${poly([IP(x, y + d, z), IP(x + w, y + d, z), IP(x + w, y + d, z + h), IP(x, y + d, z + h)], `style="fill:${shadeC(c, 84)}"`)}${poly([IP(x + w, y, z), IP(x + w, y + d, z), IP(x + w, y + d, z + h), IP(x + w, y, z + h)], `style="fill:${shadeC(c, 70)}"`)}${poly([IP(x, y, z + h), IP(x + w, y, z + h), IP(x + w, y + d, z + h), IP(x, y + d, z + h)], `style="fill:${c}"`)}</g>`;
}
// Hai dãy bàn, mỗi dãy 4 bàn, bot quay mặt về tường bảng khâu; ghế sạc 01–04 sát tường gỗ, 05–08 trước vách lửng.
const FY = 9.25, EX = 8.3, X0 = [EX, 2.7], LANE = -0.72, GAPX = MX + 0.6, SLOT = 2.6;
function geo(i){
  const col = i % 2, row = 3 - (i >> 1), yc = 1.75 + row * 2, x0 = col ? 5 : 1.8, cx = x0 + 1.35, aisle = x0 + 2.15;
  const back = i < 4, rx = MX + 1.4 + (i % 4) * SLOT, ry = back ? -RB + 0.3 : 0.15;
  return {col, yc, x0, cx, aisle, seat: [cx - 0.05, yc], stand: [aisle, yc + 0.35], rx, ry, back, rest: [rx + 0.81, ry + 0.85]};
}
const GEO = Object.fromEntries(BOTS.map((b, i) => [b.id, geo(i)]));
const NO = id => String(BOTS.findIndex(b => b.id === id) + 1).padStart(2, "0");
const PANEL_NAME = {ai: "Biên tập"};
const locOf = s => s === "ngu" ? "bed" : s === "xong" ? "stand" : "seat";
const DESK_CL = {lam: "on", cho: "wait", loi: "err", xong: "ok", ngu: "off"};

// ---------- nhân vật: đầu cầu trắng bóng, kính mặt đen, thân áo màu riêng của từng bot ----------
const EYES3 = {
  open: '<g class="blink fb"><rect x="-8" y="-54" width="5" height="7" rx="2.5" fill="var(--eye)"/><rect x="3" y="-54" width="5" height="7" rx="2.5" fill="var(--eye)"/></g>',
  happy: '<path d="M-9-49q3.2-4.5 6.4 0M2.6-49q3.2-4.5 6.4 0" stroke="var(--eye)" stroke-width="2" fill="none" stroke-linecap="round"/>',
  shut: '<path d="M-9-50.5q3.2 3 6.4 0M2.6-50.5q3.2 3 6.4 0" stroke="var(--eye)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".75"/>',
  x: '<path d="M-8-54l4.5 5M-3.5-54l-4.5 5M3.5-54l4.5 5M8-54l-4.5 5" stroke="#ff7b7b" stroke-width="1.8" stroke-linecap="round"/>',
};
// back: nhìn từ sau lưng, bot quay mặt về màn hình (trên trái) nên chỉ thấy mép kính mặt ở rìa trái đầu.
function head3(eyes, back, s){
  const face = back
    ? '<g clip-path="url(#rm-hclip)"><ellipse cx="-13.5" cy="-51" rx="7.5" ry="10.5" fill="#0a0f1c"/><ellipse cx="-15.6" cy="-52" rx="1.6" ry="2.4" fill="var(--eye)"/></g>'

  return `<g class="hd"><circle cx="0" cy="-52" r="17" class="bc"/><ellipse cx="-5.5" cy="-61.5" rx="6.5" ry="3.4" fill="#fff" opacity=".8"/>${face}<circle class="ant" cx="${back ? 13 : 15}" cy="-48" r="2.3" fill="${ANT[s]}"/></g>`;

function body3(back, s, arms){
  const arm = (k, x, hx) => `<g class="am ${k} ${arms}"><rect x="${x}" y="-35" width="7" height="15" rx="3.5"/><circle cx="${hx}" cy="-19.5" r="3.4" fill="#eef2f7"/></g>`;
  return `${arm("l", -18.5, -15)}${arm("r", 11.5, 15)}<rect x="-12.5" y="-37" width="25" height="24" rx="10" class="bt"/><rect x="-12.5" y="-37" width="25" height="24" rx="10" fill="url(#rm-bodysh)"/>${back
    ? '<path d="M0-34v17" stroke="#000" stroke-opacity=".16" stroke-width="1.3" stroke-linecap="round"/>'
    : '<path d="M-6-33q6 4.5 12 0" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" fill="none" stroke-linecap="round"/><rect x="-4" y="-27" width="8" height="5" rx="2" fill="#fff" opacity=".22"/>'}`;
}
const standSprite = (s, {back = false, eyes = "open", arms = "dn"} = {}) => `<ellipse class="sh" cx="0" cy="0" rx="14" ry="5"/>
  <rect class="lg l" x="-8.5" y="-16" width="7" height="16" rx="3.5"/><rect class="lg r" x="1.5" y="-16" width="7" height="16" rx="3.5"/>
  <g class="bodyb">${body3(back, s, arms)}${head3(eyes, back, s)}</g>`;
// Ngồi ghế làm việc, quay lưng ra ngoài, hai tay với lên bàn phím.
const seatSprite = s => `<g transform="translate(0 13)"><g class="bodyb">${body3(true, s, "ty")}${head3("open", true, s)}</g></g>`;
// Ngồi ngả trên ghế sạc, mặt hướng ra ngoài, mắt nhắm; chữ z bay lên.
const restSprite = s => `<g transform="translate(0 10)"><rect class="lg l" x="-9.5" y="-19" width="7.5" height="11" rx="3.6"/><rect class="lg r" x="2" y="-19" width="7.5" height="11" rx="3.6"/>
  <g class="hd-sl">${body3(false, s, "dn")}${head3("shut", false, s)}</g></g>
  <text class="z" x="16" y="-54" font-size="9" font-weight="700">z</text><text class="z z2" x="21" y="-62" font-size="7" font-weight="700">z</text>`;
function bubble3(s, y){
  const c = {lam: "#ffffff", cho: "#ffffff", loi: "#e5484d", xong: "#16a34a"}[s];
  if(!c) return "";
  const inner = s === "lam" ? '<circle class="dt" cx="-6" cy="0" r="2.1"/><circle class="dt d2" cx="0" cy="0" r="2.1"/><circle class="dt d3" cx="6" cy="0" r="2.1"/>'
    : s === "cho" ? '<path d="M-4-5h8l-4 5 4 5h-8l4-5z" fill="none" stroke="#b7791f" stroke-width="1.6" stroke-linejoin="round"/>'
    : s === "loi" ? '<rect x="-1.3" y="-6" width="2.6" height="7.5" rx="1.2" fill="#fff"/><rect x="-1.3" y="3" width="2.6" height="2.6" rx="1.2" fill="#fff"/>'
    : '<path d="M-5 0l3.5 3.5L5.5-4" stroke="#fff" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  return `<g class="bub3" transform="translate(0 ${y})"><g class="bf"><path d="M-12-10h24a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H4l-4 5-4-5h-8a4 4 0 0 1-4-4V-6a4 4 0 0 1 4-4z" style="fill:${c}" filter="url(#rm-drop)"/>${inner}</g></g>`;
}
function botAt(id, loc, s){
  const g = GEO[id], b = BOT[id], attrs = `class="rb ${loc} st-${s}" data-bot="${id}" data-tab="${b.tab}"${b.sub ? ` data-sub="${b.sub}"` : ""} style="--bot:${b.mau}"`;
  const title = `<title>${esc(b.ten)} · ${esc(BOT_ST[s][1])}</title>`;
  if(loc === "bed") return `<g ${attrs} transform="${tr(IP(g.rest[0], g.rest[1], 0.4))}">${title}${restSprite(s)}</g>`;
  if(loc === "seat") return `<g ${attrs} transform="${tr(IP(g.seat[0], g.seat[1], 0.48))}">${title}<g transform="scale(1.05)">${seatSprite(s)}${bubble3(s, -66)}</g></g>`;
  return `<g ${attrs} transform="${tr(IP(g.stand[0], g.stand[1]))}">${title}<g transform="scale(1.05)">${standSprite(s, {eyes: "happy", arms: "up"})}${bubble3(s, -86)}</g></g>`;
}

// ---------- đồ vật ----------
function plant(px, py, s = 1, pz = 0){
  const [X, Y] = IP(px, py, pz), w = 10 * s, h = 20 * s;
  const leaves = [[-64, 28], [64, 28], [-44, 36], [44, 36], [-24, 42], [24, 42], [-8, 46], [8, 44], [-34, 24], [34, 24], [0, 30]];
  const lv = leaves.map(([a, l], k) => { const L = l * s, c = ["#2f8f4e", "#43a862", "#5cbf75", "#2a7d45"][k % 4];
    return `<path transform="translate(${f1(X)} ${f1(Y - h + 1)}) rotate(${a})" d="M0 0C${f1(-7 * s)} ${f1(-L * .35)} ${f1(-5 * s)} ${f1(-L * .8)} 0 ${f1(-L)}C${f1(5 * s)} ${f1(-L * .8)} ${f1(7 * s)} ${f1(-L * .35)} 0 0Z" fill="${c}"/>`; }).join("");
  return `<g class="plant"><ellipse cx="${f1(X)}" cy="${f1(Y)}" rx="${f1(w * 1.5)}" ry="${f1(w * .55)}" fill="#000" opacity=".35"/>
    <path d="M${f1(X - w)} ${f1(Y - h)}L${f1(X + w)} ${f1(Y - h)}L${f1(X + w * .78)} ${f1(Y - 1)}Q${f1(X)} ${f1(Y + 2.5 * s)} ${f1(X - w * .78)} ${f1(Y - 1)}Z" fill="url(#rm-pot)"/>
    <ellipse cx="${f1(X)}" cy="${f1(Y - h)}" rx="${f1(w)}" ry="${f1(3 * s)}" fill="#f6f8fb"/><ellipse cx="${f1(X)}" cy="${f1(Y - h + .5)}" rx="${f1(w * .8)}" ry="${f1(2.1 * s)}" fill="#2a1d14"/>${lv}</g>`;
}
// Màn hình bàn quay về phía bot (+x). k = 0: màn chạy mã, k = 1: màn biểu đồ.
const SW = 0.66 * U, SH = 0.42 * U;
function monitor(x0, ya, k){
  const lens = [.62, .38, .74, .3, .5, .68, .34, .56, .44, .6], cols = ["#7cc4ff", "#e2ecff", "#5eead4"];
  let lines = "";
  for(let j = 0; j < 20; j++) lines += `<rect x="3" y="${3 + j * 2.6}" width="${f1(lens[(j + k * 3) % 10] * (SW - 6))}" height="1.3" rx=".6" fill="${cols[j % 3]}"/>`;
  const chart = `<rect x="2.5" y="2.5" width="${f1(SW / 2 - 4)}" height="7" rx="1" fill="#1e4fb8"/><rect x="${f1(SW / 2)}" y="2.5" width="${f1(SW / 2 - 2.5)}" height="7" rx="1" fill="#1a3f8f"/>
    ${[5, 8, 6, 10, 7, 11, 9, 12].map((v, j) => `<rect x="${f1(3 + j * 3.4)}" y="${f1(SH - 2.5 - v)}" width="2.2" height="${v}" rx=".5" fill="${j % 2 ? "#60a5fa" : "#3b82f6"}"/>`).join("")}`;
  return `${box(x0 + 0.1, ya - 0.72, 0.93, 0.07, 0.72, 0.5, "#0b0f19")}
    <g transform="${onX(IP(x0 + 0.172, ya - 0.03, 1.4))}"><rect width="${f1(SW)}" height="${f1(SH)}" rx="1" fill="#0b1630"/>
      <g class="idle"><rect x="3" y="3" width="${f1(SW / 2 - 4)}" height="5" rx="1" fill="#16306b"/><rect x="3" y="11" width="${f1(SW - 6)}" height="2" rx="1" fill="#132a5c"/><rect x="3" y="15" width="${f1(SW * .6)}" height="2" rx="1" fill="#132a5c"/></g>
      <g clip-path="url(#rm-sclip)"><g class="scr scr-on"><rect width="${f1(SW)}" height="${f1(SH)}" fill="#0b1d3f"/>${k ? chart : `<g class="scr-lines">${lines}</g>`}</g>
      <g class="scr scr-ok"><rect width="${f1(SW)}" height="${f1(SH)}" fill="#0c2a1c"/>${k ? chart : `<path d="M${f1(SW / 2 - 5)} ${f1(SH / 2)}l3.5 3.5 7-7" stroke="#4ade80" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`}</g>
      <g class="scr scr-err"><rect width="${f1(SW)}" height="${f1(SH)}" fill="#3a1015"/><text x="${f1(SW / 2)}" y="${f1(SH / 2 + 5)}" text-anchor="middle" font-size="14" font-weight="800" fill="#ff8a8a">!</text></g>
      <g class="scr scr-wait"><rect width="${f1(SW)}" height="${f1(SH)}" fill="#2b2410"/><path d="M${f1(SW / 2 - 4)} ${f1(SH / 2 - 6)}h8l-4 6 4 6h-8l4-6z" fill="none" stroke="#f5c451" stroke-width="1.6" stroke-linejoin="round"/></g></g>
      <circle class="standby" cx="${f1(SW - 3)}" cy="${f1(SH - 3)}" r="1.1" fill="#56607a"/></g>`;
}
// Dải LED: quầng mờ rộng bên ngoài, lõi sáng mảnh bên trong.
const ledLine = (a, c, glow = "#ff9d3a", core = "#ffd9a3") => `<path d="${iseg(a, c)}" stroke="${glow}" stroke-width="8" stroke-opacity=".55" stroke-linecap="round" filter="url(#rm-blur4)"/><path d="${iseg(a, c)}" stroke="${core}" stroke-width="1.8" stroke-linecap="round"/>`;
// Bàn khối tủ: LED vàng dưới mép mặt bàn hắt sáng khoang chân và tấm hậu, LED chân tấm hông, quầng vàng loang ra sàn.
function deskG(b, x){
  const id = b.id, {x0, yc, cx} = GEO[id], loc = locOf(x.s), y0 = yc - 0.8, y1 = yc + 0.8, DD = 0.9, TZ = 0.72, P = "#2a3142";
  const ep = IP(x0 + 0.08, y1 + 0.002, 0.6), dr = (z) => iseg(IP(x0 + 0.861, y0 + 0.06, z), IP(x0 + 0.861, y0 + 0.44, z));
  return `<g class="dk ${loc === "bed" ? "off" : DESK_CL[x.s]}" id="dk-${id}" data-bot="${id}" data-tab="${b.tab}"${b.sub ? ` data-sub="${b.sub}"` : ""} style="--bot:${b.mau}"><title>Bàn ${NO(id)} · ${esc(b.ten)}</title>
    <ellipse transform="${onF(IP(x0 + DD * 0.75, yc + 0.1))}" rx="${f1(1.25 * U)}" ry="${f1(1.5 * U)}" fill="url(#rm-amber2)"/>
    ${box(x0, y0, 0, 0.08, 1.6, TZ, P)}<g transform="${onX(IP(x0 + 0.081, y1, TZ - 0.02))}"><rect width="${f1(1.6 * U)}" height="${f1((TZ - 0.02) * U)}" fill="url(#rm-leddown)"/></g>
    ${box(x0, y0, 0, DD, 0.08, TZ, P)}${box(x0 + 0.08, y0 + 0.02, 0, DD - 0.22, 0.5, TZ - 0.03, "#323b4e")}
    <path d="${dr(0.48)}${dr(0.25)}" stroke="#000" stroke-opacity=".35" stroke-width="1.1"/>${ledLine(IP(x0 + 0.87, y0 + 0.04, 0.012), IP(x0 + 0.87, y0 + 0.5, 0.012))}
    ${box(x0, y1 - 0.08, 0, DD, 0.08, TZ, P)}<g transform="${onY(IP(x0, y1 + 0.002, TZ))}"><rect width="${f1(DD * U)}" height="${f1(TZ * U)}" fill="url(#rm-ledup)"/></g>
    ${ledLine(IP(x0 + 0.02, y1 + 0.01, 0.012), IP(x0 + DD - 0.02, y1 + 0.01, 0.012))}
    ${box(x0 - 0.04, y0 - 0.04, TZ, DD + 0.1, 1.68, 0.06, "#4b5569")}
    ${ledLine(IP(x0 + DD + 0.06, y0 - 0.02, TZ - 0.004), IP(x0 + DD + 0.06, y1 + 0.02, TZ - 0.004))}${ledLine(IP(x0 - 0.03, y1 + 0.065, TZ - 0.004), IP(x0 + DD + 0.05, y1 + 0.065, TZ - 0.004))}
    <g transform="${onY(ep)}"><rect x="1" y="-9" width="23" height="12" rx="2" fill="#0d121d" fill-opacity=".85"/><circle cx="6" cy="-3" r="2.3" fill="${b.mau}"/><text x="10.5" y="0" font-size="8" font-weight="700" fill="#f1f5fb">${NO(id)}</text></g>
    ${box(x0 + 0.08, yc - 0.06, TZ + 0.06, 0.12, 0.12, 0.17, "#3a4150")}${box(x0 + 0.05, yc - 0.2, TZ + 0.06, 0.2, 0.4, 0.012, "#3a4150")}
    ${monitor(x0, yc + 0.76, 0)}${monitor(x0, yc + 0.02, 1)}
    ${box(x0 + 0.45, yc - 0.36, TZ + 0.06, 0.2, 0.72, 0.016, "#141922")}${box(x0 + 0.48, yc + 0.5, TZ + 0.06, 0.13, 0.09, 0.02, "#141922")}
    ${plant(x0 + 0.22, y0 + 0.18, 0.42, TZ + 0.06)}
    ${box(cx - 0.26, yc - 0.26, 0, 0.52, 0.52, 0.03, "#141820")}${box(cx - 0.03, yc - 0.03, 0.03, 0.06, 0.06, 0.36, "#3a4150")}${sbox(cx - 0.3, yc - 0.3, 0.37, 0.6, 0.6, 0.11, "#1a1e27", 5)}
    <g id="ss-${id}">${loc === "seat" ? botAt(id, "seat", x.s) : ""}</g>
    ${sbox(cx + 0.2, yc - 0.29, 0.46, 0.12, 0.58, 0.7, "#151820", 6)}${sbox(cx - 0.2, yc - 0.36, 0.5, 0.4, 0.08, 0.06, "#151820", 3)}${sbox(cx - 0.2, yc + 0.28, 0.5, 0.4, 0.08, 0.06, "#151820", 3)}

let ROOM = null, ROOM_GEN = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const $id = id => document.getElementById(id);
function setGlow(id, on){ const el = $id(id); if(el) el.classList.toggle("on", !!on); }
function place(id, loc, s){
  for(const k of ["sb-", "ss-", "sd-"]){ const el = $id(k + id); if(el) el.innerHTML = ""; }
  const slot = $id({bed: "sb-", seat: "ss-", stand: "sd-"}[loc] + id);
  if(slot) slot.innerHTML = botAt(id, loc, s);
  const bed = $id("bd-" + id), desk = $id("dk-" + id);
  if(bed) bed.classList.toggle("empty", loc !== "bed");
  if(desk) desk.setAttribute("class", "dk " + (loc === "bed" ? "off" : DESK_CL[s]));
  setGlow("dg-" + id, loc !== "bed"); setGlow("sg-" + id, loc === "seat" && s === "lam"); setGlow("nl-" + id, loc === "bed");
  const nlb = $id("nlb-" + id); if(nlb) nlb.classList.toggle("on", loc === "bed");
}
function leave(id, from){
  for(const k of ["sb-", "ss-", "sd-"]){ const el = $id(k + id); if(el) el.innerHTML = ""; }
  if(from === "bed"){ const bed = $id("bd-" + id); if(bed) bed.classList.add("empty"); setGlow("nl-" + id, false); const nlb = $id("nlb-" + id); if(nlb) nlb.classList.remove("on"); }
  else { const desk = $id("dk-" + id); if(desk) desk.setAttribute("class", "dk off"); setGlow("dg-" + id, false); setGlow("sg-" + id, false); }
}
function walkSeg(w, a, c, speed, gen){
  return new Promise(res => {
    const T = Math.max(60, Math.hypot(c[0] - a[0], c[1] - a[1]) / speed * 1000), t0 = performance.now();
    const step = t => {
      if(!w.isConnected || !ROOM || ROOM.gen !== gen) return res(false);
      const k = Math.min(1, (t - t0) / T);
      const px = a[0] + (c[0] - a[0]) * k, py = a[1] + (c[1] - a[1]) * k;
      w.setAttribute("transform", tr(IP(px, py)));
      if(k < 1) requestAnimationFrame(step); else res(true);
    };
    requestAnimationFrame(step);
  });
}
// Lối đi từ một chỗ tới điểm giao X0 giữa hai phòng. Ghế sạc dãy sau: ra lối sau, vòng qua đầu vách lửng.
// Bàn dãy trong: ra lối dọc, xuống lối ngang phía trước rồi sang lối dọc sát phòng nghỉ.
function chain(id, loc){
  const g = GEO[id];
  if(loc === "bed") return g.back ? [g.rest, [g.rest[0], LANE], [GAPX, LANE], [GAPX, X0[1]], X0] : [g.rest, [g.rest[0], X0[1]], X0];
  const head = [loc === "seat" ? g.seat : g.stand, [g.aisle, g.yc]];
  return g.col ? [...head, [EX, g.yc], X0] : [...head, [g.aisle, FY], [EX, FY], X0];
}
// Đi từ chỗ cũ tới chỗ mới: ghế sạc → lối đi phòng nghỉ → phòng máy → ghế làm việc; đoạn chung của hai chuỗi bị cắt.
async function move(id, from, to, gen){
  const b = BOT[id], s = ROOM.bots[id].want.s, A = chain(id, from), B = chain(id, to);
  const same = (p, q) => Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) < 1e-6;
  while(A.length > 1 && B.length > 1 && same(A[A.length - 2], B[B.length - 2])){ A.pop(); B.pop(); }
  const path = [...A, ...B.reverse().slice(1)];
  leave(id, from);
  if(reduceMotion()) return true;
  const layer = $id("rm-walk"); if(!layer) return false;
  const w = document.createElementNS(SVGNS, "g");
  w.setAttribute("class", "rb walk st-" + s); w.setAttribute("style", "--bot:" + b.mau);
  w.dataset.bot = id; w.dataset.tab = b.tab; if(b.sub) w.dataset.sub = b.sub;
  w.setAttribute("transform", tr(IP(path[0][0], path[0][1])));
  layer.appendChild(w);
  if(from === "bed"){ w.innerHTML = `<g transform="scale(1.05)">${standSprite(s, {eyes: "happy", arms: "up"})}</g>`; w.classList.remove("walk"); await wait(650); w.classList.add("walk"); }
  const speed = DEMO ? 3.4 : 2.4;
  for(let i = 1; i < path.length; i++){
    const a = path[i - 1], c = path[i];
    if(Math.hypot(c[0] - a[0], c[1] - a[1]) < 0.01) continue;
    w.innerHTML = `<g transform="scale(1.05)">${standSprite(s, {back: c[0] < a[0] - 0.01 || c[1] < a[1] - 0.01})}</g>`;
    if(!(await walkSeg(w, a, c, speed, gen))) return false;
  }
  w.remove();
  return true;
}
async function drive(id){
  const R = ROOM, r = R.bots[id];
  if(r.busy) return;
  r.busy = true;
  while(ROOM === R && r.want.loc !== r.loc){
    const to = r.want.loc;
    if(!(await move(id, r.loc, to, R.gen))) return;
    r.loc = to; r.s = r.want.s; place(id, to, r.s);
    await wait(350);
  }
  r.busy = false;
  if(ROOM === R && r.s !== r.want.s){ r.s = r.want.s; place(id, r.loc, r.s); }
}

function runDemo(){
  stopDemo(true);

  DEMO = {st: Object.fromEntries(BOTS.map(b => [b.id, "ngu"])), timers: []};

  for(const [t, ch] of DEMO_STEPS) DEMO.timers.push(setTimeout(() => { if(DEMO){ Object.assign(DEMO.st, ch); applyRoom(); } }, (t + lead) * 1000));

// Cập nhật tại chỗ: bot đổi chỗ thì đi bộ tới chỗ mới, bot giữ chỗ thì chỉ đổi dáng; thẻ nào đổi mới vẽ lại.
function applyRoom(){
  if(!D || S.tab !== "phong-may" || !ROOM || !$id("rm-walk")) return;
  const st = roomStates();
  for(const b of BOTS){
    const x = st[b.id], r = ROOM.bots[b.id];
    r.want = {loc: locOf(x.s), s: x.s};
    if(!r.busy){
      if(r.loc !== r.want.loc) drive(b.id);
      else if(r.s !== x.s){ r.s = x.s; place(b.id, r.loc, x.s); }
    }
    const card = document.querySelector(`.bcard[data-bot="${b.id}"]`);
    if(card && card.dataset.sig !== podSig(x)){ card.outerHTML = cardHtml(b, x); }
    const wm = $id("wm-" + b.id); if(wm) wm.classList.toggle("on", !!x.warn);
    const led = $id("led-" + b.id); if(led) led.classList.toggle("on", x.s === "lam");
    const stg = $id("stg-" + b.id); if(stg) stg.setAttribute("class", "stg st-" + x.s);

  const sum = $id("room-sum"); if(sum) sum.innerHTML = roomSum(st);
  const busy = $id("rm-busy"); if(busy) busy.textContent = nf(Object.values(st).filter(v => v.s === "lam").length);
  const rest = $id("rm-rest"); if(rest) rest.textContent = `${Object.values(st).filter(v => locOf(v.s) === "bed").length} bot đang sạc, chờ lệnh${DEMO ? " · diễn thử" : ""}`;

}

const mdNow = () => Date.parse(D.tao_luc) || Date.now();
const mdTs = x => { const t = Date.parse(x.bat_dau || ""); return isNaN(t) ? null : t; };
const mdSum = a => a.reduce((s, v) => s + v, 0);
const mdAvg = a => a.length ? mdSum(a) / a.length : null;
const mdVnLuc = t => { try { return new Intl.DateTimeFormat("vi-VN", {timeZone: "Asia/Ho_Chi_Minh", hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit"}).format(new Date(t)); } catch(e) { return ""; } };
const mdPt = v => v === null || v === undefined || !isFinite(v) ? "–" : (v < 0.1 ? "<0,1" : String(Math.round(v * 10) / 10).replace(".", ",")) + "%";

const mdTroLy = luot => luot.flatMap(x => (x.tro_ly || []).map(r => ({...r, issue: x.issue, ts: mdTs(x), viec: x.viec})));
// ChatGPT: % Codex báo; hạn mức quy đổi = tổng token / tổng % tăng (khi đã đủ số đo), không thì số đặt trong config
function mdHanMuc(ai){
  const H = ((D.muc_dung_ai || {}).han_muc || {})[MD_AI[ai]] || {};
  const out = {goi: H.goi || "", "5_gio": H.token_5_gio ? {token: H.token_5_gio, nguon: "đặt"} : null, tuan: H.token_tuan ? {token: H.token_tuan, nguon: "đặt"} : null};
  if(ai === "claude"){
    // mỗi lượt CLI viết bài: % tăng trong lượt, token các trợ lý ghi trong khoảng thời gian của lượt
    const tl = mdTroLy(((D.muc_dung_ai || {}).luot || []).filter(x => mdAi(x) === "claude")).filter(r => r.ts !== null && r.token);
    const runs = mdCli().filter(x => x.tac_vu === "viet-bai" && x.han_muc).map(x => ({...x,
      tok: mdSum(tl.filter(r => r.ts >= x.t0 - 120e3 && r.ts <= x.t1 + 60e3).map(r => r.token))})).filter(x => x.tok > 0);
    ["5_gio", "tuan"].forEach(k => {
      if(out[k]) return;
      const co = runs.filter(x => x.han_muc[k] && x.han_muc[k].sau >= x.han_muc[k].truoc);
      const tang = mdSum(co.map(x => x.han_muc[k].sau - x.han_muc[k].truoc));
      if(co.length >= 2 && tang >= (k === "5_gio" ? 2 : 0.5)) out[k] = {token: mdSum(co.map(x => x.tok)) / tang * 100, nguon: `ước tính từ ${nf(co.length)} lượt CLI báo %`};
    });
  }
  if(ai === "gpt"){
    const do_ = mdTroLy((D.muc_dung_ai || {}).luot || []).filter(r => r.han_muc && r.token);
    ["5_gio", "tuan"].forEach(k => {
      if(out[k]) return;
      const co = do_.filter(r => r.han_muc[k] && r.han_muc[k].sau >= r.han_muc[k].truoc);
      const tang = mdSum(co.map(r => r.han_muc[k].sau - r.han_muc[k].truoc));
      if(co.length >= 2 && tang >= (k === "5_gio" ? 2 : 0.5)) out[k] = {token: mdSum(co.map(r => r.token)) / tang * 100, nguon: `ước tính từ ${nf(co.length)} lượt Codex báo %`};

// các lượt Claude chạy bằng CLI (data/luot-claude/), có % hạn mức gói trước, sau lượt
const mdCli = () => ((D.muc_dung_ai || {}).luot_claude || []).map(x => ({...x, t0: Date.parse(x.bat_dau || ""), t1: Date.parse(x.ket_thuc || "")})).filter(x => !isNaN(x.t0));
const MD_LUONG = {"viet-bai": "Viết, sửa, phản biện bài", "ai-daily": "Biên tập tin hằng ngày"};

function vAI(){

const KEEP = {bv: ["q"], goi: ["q", "nhom", "bai", "tt", "gap", "days"], vb: ["sub", "q", "nhom", "tt"], dt: ["days", "unit", "lv", "q"],
              kho: ["q", "lv", "cd", "dang", "loai", "nguon", "luong"], ai: ["sub", "ma", "tt", "q", "src", "srcSt"]};
function saveState(){
  const o = {tab: S.tab, range: S.range, ov: S.ov};
  for(const [k, f] of Object.entries(KEEP)) o[k] = Object.fromEntries(f.map(x => [x, S[k][x]]));

function loadState(){

function palOptions(q){

                D.repo && ["ai", "Gọi AI ngay", "AI biên tập các việc đang chờ", () => document.getElementById("ai-now").click()],
                ["moon", "Đổi nền sáng, tối", "Giao diện", toggleTheme], ["kbd", "Phím tắt", "Xem các phím tắt", () => openPalette("keys")],

  acts.forEach(([i, t, s, run]) => { if(hit(t + " " + s)) add("Thao tác", i, t, s, run); });
  if(!words.length || words.join("").length < 2) return out;
  const items = D.items.filter(it => hit(it.tieu_de + " " + (it.so_hieu || []).join(" ") + " " + (it.y_tuong ? it.y_tuong.tieu_de_web : "") + " " + it.nguon))

  return out;

function palResults(){

function palMove(d){

function runPalette(i){

}

// ---------- lượt đang chạy: live.json do workflow đẩy lên (scripts/live.sh, scripts/build.py) ----------
const LIVE_LUONG = {collect: "Lượt thu tin", merge: "Lượt ghép kết quả AI", publish: "Lượt xuất bản", "goi-ai": "Lượt gọi AI"};
const LIVE_STALE = 45 * 60e3;   // "đang chạy" mà 45 phút không cập nhật: workflow đã chết giữa chừng, không hiện nữa
let LIVE = null;
const runUrl = id => D.repo && /^\d+$/.test(id || "") ? `https://github.com/${D.repo}/actions/runs/${id}` : "";
const scanUrl = () => `https://github.com/${D.repo}/actions/workflows/collect.yml`;
const aiUrl = () => `https://github.com/${D.repo}/actions/workflows/goi-ai.yml`;
const ago = iso => { const m = Math.round((Date.now() - Date.parse(iso)) / 60e3); return m < 1 ? "vừa xong" : m < 60 ? m + " phút trước" : hm(iso) + " · " + dm(iso); };
function renderLive(){
  const el = document.getElementById("live"), btn = document.getElementById("scan-now"), L = LIVE || {};
  const fresh = h => L.cap_nhat && Date.now() - Date.parse(L.cap_nhat) < h;
  const running = L.trang_thai === "dang_chay" && fresh(LIVE_STALE), url = runUrl(L.run_id);
  btn.hidden = !D.repo;
  btn.href = running && url ? url : scanUrl();
  btn.lastElementChild.textContent = running ? "Đang quét…" : "Quét ngay";
  // đang chạy thì bấm chỉ mở trang lượt đang chạy, không gửi thêm lệnh
  btn.dataset.busy = running ? "1" : "";
  btn.title = D.lenh_token ? "Bấm để chạy một lượt thu tin ngay" : "Mở GitHub Actions; bấm Run workflow để chạy một lượt thu tin";
  // gọi AI xong thì AI còn biên tập 5–15 phút trong phiên Claude; máy tự ghép, xuất bản khi AI nộp kết quả
  const aiBtn = document.getElementById("ai-now"), called = L.trang_thai === "da_goi_ai" && fresh(30 * 60e3);
  aiBtn.hidden = !D.repo;
  aiBtn.href = aiUrl();
  aiBtn.lastElementChild.textContent = called || (running && L.luong === "goi-ai") ? "AI đang làm…" : "Gọi AI ngay";
  aiBtn.dataset.busy = called || (running && L.luong === "goi-ai") ? "1" : "";
  aiBtn.title = D.lenh_token ? "Bấm để AI biên tập ngay các việc đang chờ" : "Mở GitHub Actions; bấm Run workflow để AI biên tập ngay các việc đang chờ";
  const link = url ? '<span class="sp"></span>' + ext(url, "Xem trên GitHub", "btn ghost") : "";
  let cls = "", html = "";
  if(running){
    cls = "info";
    html = `<span class="pulse"></span><span><b>${esc(LIVE_LUONG[L.luong] || "Lượt chạy")} đang chạy</b> · ${esc(L.buoc)} · bắt đầu ${esc(hm(L.bat_dau || L.cap_nhat))}</span>${link}`;
  } else if(called){
    cls = "info";
    html = `<span class="pulse"></span><span><b>Đã gọi AI</b> lúc ${esc(hm(L.cap_nhat))} · AI đang biên tập các việc đang chờ, thường 5–15 phút; máy tự ghép và xuất bản khi AI nộp kết quả</span>${link}`;
  } else if(L.trang_thai === "loi" && fresh(12 * 36e5)){
    cls = "crit";
    html = `<span><b>${esc(LIVE_LUONG[L.luong] || "Lượt chạy")} dừng giữa chừng</b> · ở bước ${esc(L.buoc)} · ${esc(ago(L.cap_nhat))}</span>${link}`;
  } else if(L.tao_luc && L.tao_luc > D.tao_luc){
    cls = "good";
    html = `<span><b>Có bản mới</b> · cập nhật ${esc(hm(L.tao_luc))} · ${esc(dm(L.tao_luc))}</span><span class="sp"></span><button class="btn primary" type="button" id="live-reload">Tải lại</button>`;
  }
  el.className = "live " + cls; el.innerHTML = html; el.hidden = !html;
  const r = document.getElementById("live-reload");
  if(r) r.addEventListener("click", () => location.reload());
}
async function pollLive(){
  clearTimeout(pollLive.t);
  if(!document.hidden){
    try { const res = await fetch("live.json?t=" + Date.now(), {cache: "no-store"}); if(res.ok){ LIVE = await res.json(); renderLive(); refreshRoom(); } }
    catch(e) {}
  }
  pollLive.t = setTimeout(pollLive, LIVE && LIVE.trang_thai === "dang_chay" ? 15e3 : 60e3);
}
document.addEventListener("visibilitychange", () => { if(!document.hidden && D) pollLive(); });

async function open(pw){
  D = await unlock(pw);
  ME = D._ten; delete D._ten;
  NK = D.nhat_ky || {luot: [], loc: [], ai: [], yeu_cau: {}, hang_doi_toi_da: 60, phan_luong: {}};
  let saved = null;
  try { sessionStorage.setItem("radar-pw", pw); saved = sessionStorage.getItem("radar-tab"); } catch(e) {}
  saved = loadState() || saved;
  const h = OLD_TAB[location.hash.slice(1)] || location.hash.slice(1);
  S.tab = VIEWS[h] ? h : VIEWS[saved] ? saved : "tong-quan";
  document.getElementById("date").textContent = WD[wdOf(D.ngay)] + ", " + vnDate(D.ngay);
  const stamp = () => { document.getElementById("stamp").innerHTML = freshness(); };
  stamp(); setInterval(stamp, 60e3);
  document.getElementById("edit-state").innerHTML = editedToday() ? pill("good", "Đã qua AI biên tập") : pill("warn", "Chưa biên tập");
  const last = (NK.luot || [])[0];
  document.getElementById("side-foot").innerHTML = `${ME ? `<div class="row"><span>Đăng nhập: <b>${esc(ME)}</b></span></div>` : ""}<div class="row">${ic("cpu")}<span>Lượt quét gần nhất ${last ? hm(last.luot) + " · " + dm(last.ngay) : "–"}</span></div>
    <div class="row"><span>Lịch: thu tin 05:13, 14:13, 19:13 · AI 08:05 · giám sát 09:22</span></div>
    <div class="row"><button class="mini-btn" type="button" data-pal-keys style="padding:2px 7px">${ic("kbd", 13)} Phím tắt <span class="kbd" style="margin-left:4px">?</span></button></div>`;
  document.getElementById("login").hidden = true;
  document.getElementById("app").hidden = false;
  go(S.tab, false);
  renderLive();
  pollLive();
}

document.getElementById("login").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err"), btn = document.getElementById("go");
  err.textContent = ""; err.classList.remove("shake");
  btn.setAttribute("aria-busy", "true"); btn.textContent = "Đang giải mã…";
  try { await open(document.getElementById("pw").value); }
  catch(x){ err.textContent = x.message; void err.offsetWidth; err.classList.add("shake"); document.getElementById("pw").select(); }
  finally { btn.removeAttribute("aria-busy"); btn.textContent = "Mở dashboard"; }
});
document.getElementById("pw-eye").addEventListener("click", e => {
  const pw = document.getElementById("pw"), show = pw.type === "password";
  pw.type = show ? "text" : "password";
  e.currentTarget.setAttribute("aria-pressed", String(show));
  e.currentTarget.setAttribute("aria-label", show ? "Ẩn mật khẩu" : "Hiện mật khẩu");
  pw.focus();
});

(async () => {
  let t = null;
  try { t = localStorage.getItem("radar-theme"); } catch(e) {}
  setTheme(t === "light" || t === "dark" ? t : null);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if(!document.documentElement.dataset.theme) setTheme(null); if(D) drawCharts(); });
  let pw = null;
  try { pw = sessionStorage.getItem("radar-pw"); } catch(e) {}
  if(pw){ try { await open(pw); } catch(e) { try { sessionStorage.removeItem("radar-pw"); } catch(_) {} } }
})();
</script>
