<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<meta name="bingbot" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Radar pháp lý</title>
<!-- Trang không tải thư viện, phông chữ hay ảnh từ bên ngoài: dữ liệu đã giải mã chỉ ở trong trình duyệt này. -->
<style>
:root{
  color-scheme:light;
  --bg:#f4f6f9;--surface:#ffffff;--surface-2:#f6f7fa;--surface-3:#eef1f5;
  --ink:#0f172a;--ink-2:#3c4657;--muted:#667085;--line:#e3e7ee;--line-2:#d3d9e2;
  --accent:#3451d1;--accent-ink:#ffffff;--accent-soft:#eaeefe;--accent-line:#c9d2fb;
  --wash:rgba(52,81,209,.07);--shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  /* biểu đồ: bảng màu phân loại đã kiểm tra mù màu trên nền #ffffff */
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;
  --grid:#edf0f4;--axis:#c3cad5;
  /* thứ bậc (đọc sâu > nông > lưu kho; phễu) */
  --o1:#184f95;--o2:#3987e5;--o3:#86b6ef;
  /* trạng thái: luôn đi kèm biểu tượng và chữ */
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--info:#3451d1;--neutral:#98a2b3;
  --good-ink:#0b6b0b;--crit-ink:#b42323;--warn-ink:#8a5a00;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0b0e14;--surface:#141922;--surface-2:#181e29;--surface-3:#1e2532;
  --ink:#e8ecf3;--ink-2:#c1c9d6;--muted:#8d97a8;--line:#242c3a;--line-2:#2f3949;
  --accent:#8ea3ff;--accent-ink:#0b0e14;--accent-soft:#1d2546;--accent-line:#34407a;
  --wash:rgba(142,163,255,.09);--shadow:none;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;
  --grid:#1f2631;--axis:#364153;
  --o1:#9ec5f4;--o2:#5598e7;--o3:#256abf;
  --good-ink:#5fd35f;--crit-ink:#ff8a8a;--warn-ink:#f5c451;--info:#8ea3ff;--neutral:#6b7588;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0e14;--surface:#141922;--surface-2:#181e29;--surface-3:#1e2532;
  --ink:#e8ecf3;--ink-2:#c1c9d6;--muted:#8d97a8;--line:#242c3a;--line-2:#2f3949;
  --accent:#8ea3ff;--accent-ink:#0b0e14;--accent-soft:#1d2546;--accent-line:#34407a;
  --wash:rgba(142,163,255,.09);--shadow:none;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;
  --grid:#1f2631;--axis:#364153;
  --o1:#9ec5f4;--o2:#5598e7;--o3:#256abf;
  --good-ink:#5fd35f;--crit-ink:#ff8a8a;--warn-ink:#f5c451;--info:#8ea3ff;--neutral:#6b7588;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-text-size-adjust:100%}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- đăng nhập ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.login-card h1{font-size:20px;margin:14px 0 4px}
.login-card p{margin:0 0 18px;color:var(--muted);font-size:13px}
.login-card label{display:block;font-size:12.5px;color:var(--ink-2);margin:0 0 6px;font-weight:600}
.login-card input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2)}
.login-card button{width:100%;margin-top:12px;padding:11px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;cursor:pointer}
.err{color:var(--crit-ink);font-size:13px;min-height:1.5em;margin-top:10px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.02em}

/* ---------- khung ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side-col{background:var(--surface);border-right:1px solid var(--line)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:18px 14px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 16px}
.brand .logo{width:34px;height:34px;font-size:12px;border-radius:9px}
.brand b{display:block;font-size:14.5px;line-height:1.2}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:9px;background:none;color:var(--ink-2);cursor:pointer;text-align:left;font-weight:520}
.nav button:hover{background:var(--surface-3)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav .cnt{margin-left:auto;min-width:22px;padding:0 7px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);font-size:11.5px;font-weight:650;text-align:center;line-height:20px}
.nav button[aria-current="page"] .cnt{background:var(--accent);color:var(--accent-ink)}
.nav .cnt.hot{background:var(--crit);color:#fff}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:6px}
.side-foot .row{display:flex;align-items:center;gap:7px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .date-wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top .date{font-weight:650}
.top .sp{flex:1}
.icon-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:13px}
.icon-btn:hover{border-color:var(--line-2);color:var(--ink)}
.mobile-brand,.mtabs{display:none}
main{padding:24px 28px 56px;max-width:1440px;width:100%;margin:0 auto}
.live-wrap{padding:16px 28px 0;max-width:1440px;margin:0 auto}
.live-wrap:has(> .live[hidden]){display:none}
.live{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--info);background:var(--surface);font-size:13px}
.live.crit{border-left-color:var(--crit)}.live.good{border-left-color:var(--good)}
.live .sp{flex:1}
.live .pulse{width:8px;height:8px;border-radius:50%;background:var(--info);flex:0 0 auto;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live .pulse{animation:none}}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 18px}
.page-h h1{font-size:22px;line-height:1.25;margin:0;letter-spacing:-.01em}
.page-h p{margin:4px 0 0;color:var(--muted);font-size:13.5px}

/* ---------- thành phần ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 0}
.card-h h2{font-size:14.5px;margin:0;line-height:1.35}
.card-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.card-h .acts{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.card-b{padding:14px 18px 18px}
.card-b.flush{padding:8px 0 4px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-3);gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;font-weight:550}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:650}
.mini-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:7px;padding:3px 8px;font-size:12px;cursor:pointer}
.mini-btn:hover{color:var(--ink);border-color:var(--line-2)}
.mini-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{text-decoration:none;border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.filters input[type=search],.filters select{height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);min-width:0}
.filters input[type=search]{flex:1 1 240px}
.filters .chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2);padding:0 4px;cursor:pointer}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto;scrollbar-width:none}
.subtabs button{border:0;background:none;padding:9px 12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:550;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:650}
.empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.55}

/* thẻ chỉ số */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:0 0 16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;cursor:default}
button.kpi{cursor:pointer;font:inherit;color:inherit}
button.kpi:hover{border-color:var(--accent-line)}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:550;display:flex;gap:6px;align-items:center}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.kpi .val{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.kpi .val small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi .sub{font-size:12px;color:var(--muted);line-height:1.45}
.delta{font-size:12px;font-weight:650}
.delta.up{color:var(--good-ink)}.delta.down{color:var(--crit-ink)}
.meter{height:6px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin-top:8px}
.meter span{display:block;height:100%;background:var(--accent);border-radius:99px}

/* nhãn, huy hiệu */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:18px;white-space:nowrap;background:var(--surface-3);color:var(--ink-2);border:1px solid transparent}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--neutral);flex:0 0 auto}
.pill.good .dot{background:var(--good)}.pill.warn .dot{background:var(--warn)}.pill.serious .dot{background:var(--serious)}
.pill.crit .dot{background:var(--crit)}.pill.info .dot{background:var(--info)}
.pill.crit{background:color-mix(in srgb,var(--crit) 12%,var(--surface));color:var(--crit-ink)}
.pill.good{background:color-mix(in srgb,var(--good) 11%,var(--surface));color:var(--good-ink)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn-ink)}
.pill.serious{background:color-mix(in srgb,var(--serious) 15%,var(--surface));color:var(--ink-2)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.line{background:none;border-color:var(--line-2);color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--ink-2)}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.tag.b{background:color-mix(in srgb,var(--s3) 14%,var(--surface));color:var(--ink-2)}
.heat{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.heat i{width:6px;height:12px;border-radius:2px;background:var(--line-2)}
.heat i.on{background:var(--neutral)}
/* màu theo mức điểm: 1–2 đỏ, 3–4 vàng, 5 xanh */
.heat.lo i.on{background:var(--crit)}.heat.mid i.on{background:var(--warn)}.heat.hi i.on{background:var(--good)}
.heat b{font-size:12px;margin-left:5px}

/* cảnh báo */
.alerts{display:grid;gap:8px;margin:0 0 16px}
.alert{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--neutral)}
.alert.crit{border-left-color:var(--crit)}.alert.warn{border-left-color:var(--warn)}.alert.info{border-left-color:var(--info)}
.alert .ic-w{font-weight:800;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:0 0 auto;background:var(--surface-3)}
.alert.crit .ic-w{background:var(--crit);color:#fff}.alert.warn .ic-w{background:var(--warn);color:#1a1200}.alert.info .ic-w{background:var(--accent);color:var(--accent-ink)}
.alert .t{flex:1;min-width:0}
.alert .t b{display:block;font-size:13.5px}
.alert .t span{font-size:12.5px;color:var(--muted)}

/* danh sách */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;padding:11px 18px;border-top:1px solid var(--line);align-items:flex-start}
.li:first-child{border-top:0}
.li.click{cursor:pointer}
.li.click:hover{background:var(--surface-2)}
.li .main{flex:1;min-width:0}
.li .ttl{font-weight:600;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li a.ttl:hover{color:var(--accent);text-decoration:none}
.li .meta{font-size:12px;color:var(--muted);margin-top:3px}
.li .side-r{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.datebox{flex:0 0 auto;width:48px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:4px 0;background:var(--surface-2)}
.datebox b{display:block;font-size:15px;line-height:1.2}
.datebox span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.group-h{padding:12px 18px 6px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-top:1px solid var(--line);background:var(--surface-2)}
.group-h:first-child{border-top:0;border-radius:14px 14px 0 0}

/* bảng */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .t1{font-weight:600;color:var(--ink);line-height:1.4}
td a.t1:hover{color:var(--accent)}
td .t2{font-size:12px;color:var(--muted);margin-top:2px}
td.nw{white-space:nowrap}
.more{display:block;width:calc(100% - 36px);margin:10px 18px 16px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;color:var(--ink-2);font-weight:600}

/* biểu đồ */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart .grid-l{stroke:var(--grid);stroke-width:1}
.chart .axis-l{stroke:var(--axis);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .val{fill:var(--ink-2);font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums}
.chart .hit{fill:transparent;cursor:default;outline:none}
.chart .hit:hover,.chart .hit:focus{fill:var(--wash)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.ln{height:3px;width:14px;border-radius:2px}
.hb{display:flex;flex-direction:column;gap:9px}
.hb-row{display:grid;grid-template-columns:minmax(90px,34%) minmax(0,1fr);gap:12px;align-items:center;border-radius:6px;padding:1px 0}
.hb-row:hover,.hb-row:focus{background:var(--wash);outline:none}
.hb-row.click{cursor:pointer}
.hb-lab{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.hb-bars{display:flex;flex-direction:column;gap:2px}
.hb-track{display:flex;align-items:center;gap:6px;height:14px}
.hb-row.single .hb-track{height:18px}
.hb-bar{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}
.hb-bar.zero{min-width:0}
.hb-val{font-size:11.5px;color:var(--ink-2);font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.hb-pct{font-weight:500;color:var(--muted)}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-wrap svg{flex:0 0 auto}
.donut-legend{display:grid;gap:8px;flex:1;min-width:150px}
.donut-legend div{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;font-size:12.5px}
.donut-legend i{width:10px;height:10px;border-radius:3px}
.donut-legend b{font-variant-numeric:tabular-nums}
.donut-legend em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.heatmap{border-collapse:separate;border-spacing:2px;font-size:12px;width:100%}
.heatmap th{background:none;text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--muted);font-weight:600;padding:4px 6px;position:static;white-space:nowrap}
.heatmap th.rh{text-align:right;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.heatmap td{border:0;padding:0;text-align:center;height:30px;min-width:38px;border-radius:5px;font-weight:650;font-variant-numeric:tabular-nums;vertical-align:middle;background:var(--surface-2);color:var(--muted)}
.heatmap td:focus,.heatmap td:hover{outline:2px solid var(--ink);outline-offset:-2px}
.q1{background:#cde2fb!important;color:#0f172a!important}.q2{background:#9ec5f4!important;color:#0f172a!important}
.q3{background:#5598e7!important;color:#fff!important}.q4{background:#256abf!important;color:#fff!important}.q5{background:#104281!important;color:#fff!important}

/* quy trình */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow);margin:0 0 16px}
.step{padding:14px 16px;border-left:1px solid var(--line);position:relative;min-width:0}
.step:first-child{border-left:0}
.step .no{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.step h3{margin:2px 0 6px;font-size:13.5px}
.step .big{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.step ul{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--ink-2);display:grid;gap:2px}
.step ul li{display:flex;justify-content:space-between;gap:8px}
.step ul b{font-variant-numeric:tabular-nums}
.daychips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.daychips button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;cursor:pointer;text-align:left;font-size:12.5px;color:var(--ink-2);display:flex;gap:7px;align-items:center}
.daychips button b{color:var(--ink)}
.daychips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.daychips .dot{width:7px;height:7px;border-radius:50%}
details.row-d summary{cursor:pointer;color:var(--accent);font-size:12px;list-style:none;margin-top:4px}
details.row-d summary::-webkit-details-marker{display:none}
details.row-d[open] summary{margin-bottom:6px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:12.5px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink-2);overflow-wrap:anywhere}

/* gợi ý: danh sách - chi tiết */
.md{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:16px;align-items:start}
.md-list{display:flex;flex-direction:column;gap:8px;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;padding:2px 4px 2px 2px}

.md-group:first-child{margin-top:0}
.sug{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;display:block;box-shadow:var(--shadow)}
.sug:hover{border-color:var(--accent-line)}
.sug[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sug .r1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.sug .r1 .st{margin-left:auto}
.sug h3{font-size:13.5px;margin:6px 0 4px;line-height:1.4;font-weight:650}
.sug .r3{font-size:12px;color:var(--muted)}
.detail{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.detail .hd{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.detail .hd .badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.detail .hd h2{font-size:18px;line-height:1.4;margin:10px 0 6px;letter-spacing:-.005em}
.detail .hd .src{font-size:12.5px;color:var(--muted)}
.detail .sec{padding:14px 20px;border-bottom:1px solid var(--line)}
.detail .sec:last-child{border-bottom:0}
.detail .sec h4{margin:0 0 8px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.detail .sec p{margin:0;line-height:1.6}
.tone ol,.tone ul{margin:6px 0 0;padding-left:20px;line-height:1.65;font-size:13px}
.tone .lab{margin-top:10px;font-size:12px;color:var(--muted)}
.idea-title{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;font-weight:650;line-height:1.45}
.copy{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:2px 4px;white-space:nowrap}
.kw{display:flex;gap:6px;flex-wrap:wrap}
.kw span{padding:3px 9px;border-radius:7px;background:var(--surface-3);font-size:12.5px}
.kw span:first-child{background:var(--accent-soft);color:var(--accent);font-weight:600}
.facts{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 14px;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
/* ngăn chi tiết trượt từ phải: bấm một dòng trong bảng để mở */
tr.click{cursor:pointer}
tr.click:hover .t1{color:var(--accent)}
tr.click:focus-visible{outline:0}tr.click:focus-visible td{background:var(--accent-soft)}
.drawer-bg{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.34)}
.card.detail.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(680px,100vw);max-height:none;overflow:auto;border-radius:0;border-width:0 0 0 1px;box-shadow:-10px 0 30px rgba(15,23,42,.18)}
.dr-top{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.dr-top .sp{flex:1}
.dr-tbl th,.dr-tbl td{padding:6px 8px;font-size:12.5px}
.pending{padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--line-2);color:var(--ink-2);font-size:13px;line-height:1.55}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.back{display:none}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.score div{padding:9px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.score b{display:block;font-size:17px}
.score span{font-size:11.5px;color:var(--muted)}

/* ---------- phòng máy ---------- */
:root{--room-wall:#edf1f7;--room-wall-2:#e1e7f0;--room-floor:#dfe5ee;--room-line:#cbd3df;--desk:#d1a678;--desk-2:#bb8f62;--desk-3:#9b7350;
  --bed:#f3f5fa;--face:#0f1626;--eye:#7fe3ff;--shade:rgba(15,23,42,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--room-wall:#1c2333;--room-wall-2:#171d2a;--room-floor:#131924;--room-line:#2c3547;
  --desk:#7d5d3f;--desk-2:#684c32;--desk-3:#523b27;--bed:#a9b2c3;--face:#05080f;--eye:#7fe3ff;--shade:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--room-wall:#1c2333;--room-wall-2:#171d2a;--room-floor:#131924;--room-line:#2c3547;
  --desk:#7d5d3f;--desk-2:#684c32;--desk-3:#523b27;--bed:#a9b2c3;--face:#05080f;--eye:#7fe3ff;--shade:rgba(0,0,0,.4)}
.nav .cnt.on{background:var(--info);color:#fff}
.room-sum{display:flex;gap:6px;flex-wrap:wrap}
.room3d{overflow:hidden;border-top:1px solid var(--line);border-radius:0 0 14px 14px;background:radial-gradient(120% 90% at 50% 0%,var(--surface-2),var(--surface))}
.room3d svg{display:block;width:100%;height:auto}
.room-page .bc{fill:var(--bot)}.room-page .bd{fill:color-mix(in srgb,var(--bot) 66%,#000)}.room-page .sbd{stroke:color-mix(in srgb,var(--bot) 66%,#000)}
.room-page .bx polygon{stroke:rgba(15,23,42,.08);stroke-width:.6;stroke-linejoin:round}
.room-page .fb{transform-box:fill-box;transform-origin:center}
.rb .lg,.rb .am{fill:color-mix(in srgb,var(--bot) 66%,#000)}
.rb .sh{fill:var(--shade)}
.rb .hd,.rb .bodyb,.rb .hd-sl,.rb .lg,.rb .am{transform-box:fill-box}
.rb .hd,.rb .bodyb,.rb .hd-sl{transform-origin:50% 100%}.rb .lg{transform-origin:50% 0}.rb .am{transform-origin:50% 12%}
.rb .am.up.l{transform:rotate(150deg)}.rb .am.up.r{transform:rotate(-150deg)}.rb .am.fw{transform:scaleY(.6)}
.rb.walk .lg.l{animation:r3-step .44s ease-in-out infinite}.rb.walk .lg.r{animation:r3-step .44s ease-in-out -.22s infinite}
.rb.walk .am.l{animation:r3-swing .44s ease-in-out infinite}.rb.walk .am.r{animation:r3-swing .44s ease-in-out -.22s infinite}
.rb.walk .bodyb{animation:r3-bob .22s ease-in-out infinite alternate}
.rb.seat.st-lam .bodyb{animation:r3-type .46s ease-in-out infinite}.rb.seat.st-lam .hd{animation:r3-nod 2.6s ease-in-out infinite}
.rb.st-loi .hd{animation:r3-shake 2.2s ease-in-out infinite}.rb.st-cho .hd{animation:r3-nod 3.4s ease-in-out infinite}
.rb.stand .bodyb{animation:r3-hop 1.1s ease-in-out infinite}
.rb.bed .hd-sl{animation:r3-breathe 4.6s ease-in-out infinite}
.rb .blink{animation:r3-blink 4.2s infinite}
.rb.st-lam .ant,.rb.st-loi .ant{animation:r3-ping 1s ease-in-out infinite}
.rb .z{opacity:0;animation:r3-z 3.6s ease-in infinite}.rb .z2{animation-delay:1.2s}.rb .z3{animation-delay:2.4s}
.bub3 .bf{animation:r3-float 2.4s ease-in-out infinite}
.bub3 .dt{fill:var(--accent);animation:r3-dot 1.2s ease-in-out infinite}.bub3 .d2{animation-delay:.2s}.bub3 .d3{animation-delay:.4s}
.dk .scr{display:none}.dk.on .scr-on,.dk.err .scr-err,.dk.ok .scr-ok,.dk.wait .scr-wait{display:inline}
.dk.on .scr-lines{animation:r3-scroll 2.6s linear infinite}
.dk .standby{animation:r3-ping 2.4s ease-in-out infinite}.dk:not(.off) .standby{display:none}
.bd3 .blk-fold{display:none}.bd3.empty .blk-fold{display:inline}.bd3.empty .blk-full{display:none}
.wm{display:none}.wm.on{display:inline}
.glw{opacity:0;transition:opacity .9s;pointer-events:none}.glw.on{opacity:1}
.led3{animation:r3-ping 1.6s steps(2) infinite}
.bled{fill:#2a3142}.bled.on{fill:var(--c)}
.dk,.bd3,.rb{cursor:pointer}
.dk.hl,.bd3.hl,.rb.hl{filter:drop-shadow(0 0 5px var(--accent))}
@keyframes r3-step{50%{transform:translateY(-4px)}}
@keyframes r3-swing{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
@keyframes r3-bob{to{transform:translateY(-2px)}}
@keyframes r3-type{50%{transform:translateY(1.6px)}}
@keyframes r3-nod{50%{transform:rotate(3deg)}}
@keyframes r3-shake{0%,70%,100%{transform:translateX(0)}75%,85%{transform:translateX(-2px)}80%,90%{transform:translateX(2px)}}
@keyframes r3-hop{50%{transform:translateY(-6px)}}
@keyframes r3-breathe{50%{transform:scale(1.05)}}
@keyframes r3-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes r3-ping{50%{opacity:.25}}
@keyframes r3-z{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.9}100%{opacity:0;transform:translate(12px,-22px) scale(1.2)}}
@keyframes r3-float{50%{transform:translateY(-3px)}}
@keyframes r3-dot{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes r3-scroll{to{transform:translateY(-22px)}}
@media (prefers-reduced-motion:reduce){.room-page *{animation:none!important;transition:none!important}}
/* phòng máy navy, phòng nghỉ gỗ ấm: cảnh luôn tối như phòng vận hành thật, không đổi theo nền sáng, tối */
.room3d{background:radial-gradient(70% 90% at 38% 28%,#14214a,#0a1229 62%,#070c1d);border-top-color:#16213f}

.room-page .bt{fill:var(--bot)}.room3d .rb .am{fill:color-mix(in srgb,var(--bot) 85%,#000)}.room3d .rb .lg{fill:#e3e8f0}
.room3d .rb .bt{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--bot) 75%,transparent))}.rb .am.ty.l{transform:rotate(62deg)}.rb .am.ty.r{transform:rotate(70deg)}
.room-page .acc{fill:var(--bot)}
.room3d .rb{--eye:color-mix(in srgb,var(--bot) 40%,#fff)}
.room3d .rb .sh{fill:rgba(0,0,0,.4)}
.room3d .bx polygon{stroke:rgba(0,0,0,.18)}
.room3d .rb .z{fill:#9fd8ff}
.bd3 .twp{opacity:.6;transition:opacity .6s}.bd3:not(.empty) .twp{opacity:1;animation:r3-ping 2.4s ease-in-out infinite}
.stg .stg-fr{stroke:#1f3366;stroke-width:.9}.stg .stg-bar{fill:var(--bot);opacity:.35}.stg .stg-dot{fill:#3d4b6b}
.stg.st-lam .stg-fr{stroke:var(--bot);stroke-width:1.4}.stg.st-lam .stg-bar{opacity:1}.stg.st-lam .stg-dot{fill:#5ee0a0;animation:r3-ping 1s ease-in-out infinite}
.stg.st-xong .stg-dot{fill:#5ee0a0}.stg.st-cho .stg-dot{fill:#f5c451}.stg.st-loi .stg-dot{fill:#ff6b6b}.stg.st-loi .stg-fr{stroke:#ff6b6b}
.stg{cursor:pointer}.stg.hl{filter:drop-shadow(0 0 4px var(--bot))}
.bled{fill:#1a2340}.bled.on{fill:var(--c)}
.bub3 .dt{fill:#2f6bff}
.bd3 .podscr{opacity:.2}.bd3:not(.empty) .podscr{opacity:1}
.rb.bed .bodyb{animation:r3-breathe 5s ease-in-out infinite}
.rb .bfill{transform-box:fill-box;transform-origin:0 50%;animation:r3-charge 2.4s ease-in-out infinite}
@keyframes r3-charge{0%{transform:scaleX(.25)}70%,100%{transform:scaleX(1)}}
.bd3 .core{opacity:.15}.bd3:not(.empty) .core{opacity:1}
.bd3 .chg{transform-box:fill-box;transform-origin:0 50%;opacity:.25}.bd3:not(.empty) .chg{opacity:1;animation:r3-charge 2.4s ease-in-out infinite}
.bd3:not(.empty) .halo{animation:r3-ping 2.4s ease-in-out infinite}
@keyframes r3-charge{0%{transform:scaleX(.2)}70%,100%{transform:scaleX(1)}}
/* thẻ trạng thái dưới toàn cảnh */
.bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.bcard{display:grid;gap:5px;align-content:start;padding:12px 14px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .2s,transform .2s}
.bcard:hover,.bcard.hl{border-color:var(--accent-line);transform:translateY(-1px)}
.bcard.lam{border-color:color-mix(in srgb,var(--info) 55%,var(--line))}.bcard.loi{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))}
.bcard .av{width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--bot) 16%,var(--surface));display:grid;place-items:center;flex:0 0 auto}

.pod-h{display:flex;align-items:center;gap:9px}
.pod-h b{flex:1;min-width:0;font-size:14px;line-height:1.3}
.pod-role{font-size:12.5px;color:var(--muted);line-height:1.4}
.pod-now{font-size:12.5px;color:var(--ink-2);line-height:1.45;min-height:36px}
.pod-now .w{color:var(--warn-ink);font-weight:600}
.pod-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 0}
.pod-stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 9px;min-width:0}
.pod-stats dt{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod-stats dd{margin:0;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
/* lịch trong ngày */
.tl{position:relative;height:178px;margin:2px 14px 0}
.tl-line{position:absolute;left:0;right:0;top:84px;height:4px;border-radius:2px;background:var(--surface-3)}
.tl-past{position:absolute;left:0;top:84px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--accent) 40%,var(--surface-3))}
.tl-hr{position:absolute;bottom:0;transform:translateX(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-ev{position:absolute;top:77px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.tl-ev i{width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--c);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#fff}
.tl-ev.done i{background:var(--c)}
.tl-ev.miss i{border-color:var(--crit);background:var(--crit)}
.tl-ev span{position:absolute;white-space:nowrap;font-size:11.5px;line-height:1.25;text-align:center;color:var(--ink-2)}
.tl-ev span small{display:block;color:var(--muted);font-size:10.5px}
.tl-ev.up span{bottom:24px}.tl-ev.up2 span{bottom:56px}.tl-ev.dn span{top:24px}.tl-ev.dn2 span{top:56px}
.tl-ev.up2::before,.tl-ev.dn2::before{content:"";position:absolute;left:50%;width:1px;height:30px;background:var(--line-2)}.tl-ev.up2::before{bottom:20px}.tl-ev.dn2::before{top:20px}
.tl-now{position:absolute;top:10px;bottom:24px;width:2px;background:var(--accent);transform:translateX(-50%)}
.tl-now b{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-size:10.5px;padding:1px 6px;border-radius:6px;white-space:nowrap}
.tl-list{display:none;margin:4px 0 0;padding:0;list-style:none}
.tl-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.tl-list li:first-child{border-top:0}
.tl-list .t{font-variant-numeric:tabular-nums;font-weight:650;width:44px}
.tl-list .d{width:10px;height:10px;border-radius:50%;background:var(--c);flex:0 0 auto}
.tl-list .s{margin-left:auto}
.rlog{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.rlog li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.45}
.rlog li:first-child{border-top:0}
.rlog .t{flex:0 0 74px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;padding-top:1px}
.rlog .d{flex:0 0 auto;width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--c)}
@media (max-width:1280px){.bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

let D = null, NK = null, CH = [];

// ---------- giải mã ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const res = await fetch("data.enc?t=" + Date.now(), {cache: "no-store"});   // tham số t: bỏ qua bộ đệm CDN của Pages
  if(!res.ok) throw new Error("Không tải được dữ liệu (" + res.status + ").");
  const blob = await res.json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(blob.salt), iterations:blob.iter, hash:"SHA-256"},
                                            base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  let plain;
  try { plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct)); }
  catch(e){ throw new Error("Sai mật khẩu."); }
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

// ---------- tiện ích ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";
const ext = (url, html, cls = "") => `<a class="${cls}" href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${html}</a>`;
const nf = n => new Intl.NumberFormat("vi-VN").format(n || 0);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const DAY = 864e5;
const addDays = (s, n) => new Date(Date.parse(s.slice(0, 10) + "T00:00:00Z") + n * DAY).toISOString().slice(0, 10);
const dayDiff = (a, b) => Math.round((Date.parse(b.slice(0, 10)) - Date.parse(a.slice(0, 10))) / DAY);
const WD = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
const WDS = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
const wdOf = s => new Date(s.slice(0, 10) + "T00:00:00Z").getUTCDay();
const dm = s => s ? s.slice(8, 10) + "/" + s.slice(5, 7) : "";
const vnDate = s => s ? dm(s) + "/" + s.slice(0, 4) : "";
const hm = s => (s || "").slice(11, 16);
const fold = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
const fieldName = k => (D.linh_vuc || {})[k] || (k === "tin_tuc" ? "Tin tức chung" : k);
const fields = it => (it.linh_vuc || []).map(fieldName).join(", ") || "Tin tức chung";
// chủ đề con dạng "thua_ke.the_vi" (config/taxonomy.yaml, mục chu_de)
const topics = it => (it.chu_de || []).map(k => (D.chu_de || {})[k] || k).join(", ");
const groupOf = it => it.nhom === "A" || it.nhom === "B" ? it.nhom : "tin_tuc";
// dạng tin = tin THU VỀ là gì; dạng bài = bài TRẢ RA viết kiểu gì, giọng nào (config/dang-bai.yaml)
const kindOf = it => (D.dang_tin || {})[it.dang_tin] || null;
const fmtOf = it => (D.dang_bai || {})[it.dang_bai] || null;
const kindName = it => (kindOf(it) || {}).ten || "Chưa phân loại";
const fmtName = it => (fmtOf(it) || {}).ten || "Chưa rõ dạng bài";
const kindUnsure = it => it.dang_tin_tin_cay !== "cao" ? pill("warn", "Máy chưa chắc", "Dấu hiệu yếu; tin đọc sâu sẽ được AI xác định lại") : "";
const live = it => it.trang_thai !== "bo_qua";
const byHeat = (a, b) => (b.diem_nong || 0) - (a.diem_nong || 0) || (b.bien_tap ? 1 : 0) - (a.bien_tap ? 1 : 0)
                         || (b.diem_so_bo || 0) - (a.diem_so_bo || 0) || (b.ngay_thu || "").localeCompare(a.ngay_thu || "");
const countBy = (arr, f) => arr.reduce((m, x) => { const k = f(x); if(k != null) m[k] = (m[k] || 0) + 1; return m; }, {});
const days = n => Array.from({length: n}, (_, i) => addDays(D.ngay, i - n + 1));
const tipAttr = o => ` data-tip="${esc(JSON.stringify(o))}" tabindex="0"`;
const pill = (cls, label, title) => `<span class="pill ${cls || ""}"${title ? ` title="${esc(title)}"` : ""}><span class="dot"></span>${esc(label)}</span>`;
const heat = n => `<span class="heat ${!n ? "" : n <= 2 ? "lo" : n <= 4 ? "mid" : "hi"}" title="Điểm nóng ${n || 0}/5">${[1,2,3,4,5].map(i => `<i class="${i <= (n || 0) ? "on" : ""}"></i>`).join("")}<b>${n || "–"}/5</b></span>`;
const groupTag = it => { const g = groupOf(it); return g === "tin_tuc" ? "" : `<span class="tag ${g === "A" ? "a" : "b"}">${NHOM[g]}</span>`; };
const sel = (id, label, cur, opts, all = "Tất cả") => `<select id="${id}" aria-label="${esc(label)}"><option value="">${esc(label)}: ${esc(all)}</option>${opts.map(([v, t]) =>
    `<option value="${esc(v)}"${String(v) === String(cur) ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
const seg = (id, cur, opts) => `<div class="seg" role="group">${opts.map(([v, t]) =>
    `<button type="button" data-seg="${id}" data-v="${esc(v)}" aria-pressed="${String(v) === String(cur)}">${esc(t)}</button>`).join("")}</div>`;
const empty = t => `<p class="empty">${esc(t)}</p>`;

function countdown(dateStr){
  const n = dayDiff(D.ngay, dateStr);
  if(n === 0) return pill("crit", "Hiệu lực hôm nay");
  if(n > 0) return pill(n <= 7 ? "warn" : "line", "Còn " + n + " ngày");
  return pill("good", "Đã có hiệu lực");
}
function kiemChung(it){
  if(it.kiem_chung === "da") return pill("good", "Có căn cứ gốc", it.nguon_kiem_chung || "");
  if(it.kiem_chung === "chua" || ((it.so_hieu || []).length && it.kiem_chung !== "khong_can")) return pill("crit", "Chưa kiểm chứng");
  return "";
}
function issueLink(it, label){
  const verb = label === "chon-viet" ? "Chọn viết" : "Bỏ qua";

  const q = new URLSearchParams({title: verb + ": " + it.tieu_de.slice(0, 120), labels: label, body});
  return "https://github.com/" + D.repo + "/issues/new?" + q.toString();
}

  toast("Đã sao chép");
}

// ---------- biểu đồ (SVG, HTML; không dùng thư viện ngoài) ----------
function niceTicks(max, n = 4){
  max = Math.max(1, max);
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = Math.max(1, [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw));
  const out = [];
  for(let v = 0; v < max + step; v += step){ out.push(v); if(v >= max) break; }
  return out;
}
function legend(series, line){
  return `<div class="legend">${series.map(s => `<span><i class="${line ? "ln" : ""}" style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}
// Cột (chồng): spec = {cats:[{label, tip}], series:[{name,color}], vals:[[...]], h}
function colChart(spec){
  CH.push(spec);
  return `<div class="chart" data-ci="${CH.length - 1}" style="height:${spec.h || 220}px"></div>`;
}
function colSVG(s, W){
  const H = s.h || 220, n = s.cats.length;
  if(!n || W < 60) return "";
  const totals = s.vals.map(v => v.reduce((a, b) => a + b, 0));
  const ticks = niceTicks(Math.max(...totals)), top = ticks[ticks.length - 1];
  const ml = 14 + 7 * nf(top).length, mr = 6, mt = 20, mb = 26;
  const pw = W - ml - mr, ph = H - mt - mb, band = pw / n, bw = Math.max(3, Math.min(24, band * 0.62));
  const y = v => mt + ph - v / top * ph;
  let g = "";
  ticks.forEach(t => { const yy = Math.round(y(t)) + .5;
    g += `<line class="${t === 0 ? "axis-l" : "grid-l"}" x1="${ml}" x2="${W - mr}" y1="${yy}" y2="${yy}"/><text class="tick" x="${ml - 8}" y="${yy + 4}" text-anchor="end">${nf(t)}</text>`; });
  const every = Math.max(1, Math.ceil(n * 44 / pw));
  const maxI = totals.indexOf(Math.max(...totals));
  let bars = "", hits = "";
  s.cats.forEach((c, i) => {
    const cx = ml + band * i + band / 2, x = cx - bw / 2;
    if((n - 1 - i) % every === 0) g += `<text class="tick" x="${cx}" y="${H - 8}" text-anchor="middle">${esc(c.label)}</text>`;
    let base = y(0), last = -1, first = true;
    s.vals[i].forEach((v, j) => { if(v > 0) last = j; });
    s.vals[i].forEach((v, j) => {
      if(v <= 0) return;
      const full = v / top * ph, gap = first ? 0 : 2, h = Math.max(1, full - gap), yT = base - gap - h;
      const r = j === last ? Math.min(4, bw / 2, h) : 0;
      bars += `<path style="fill:${s.series[j].color}" d="M${x},${yT + h}V${yT + r}${r ? `Q${x},${yT} ${x + r},${yT}H${x + bw - r}Q${x + bw},${yT} ${x + bw},${yT + r}` : `H${x + bw}`}V${yT + h}Z"/>`;
      base = yT; first = false;
    });
    if(totals[i] > 0 && (i === n - 1 || i === maxI)) bars += `<text class="val" x="${cx}" y="${base - 6}" text-anchor="middle">${nf(totals[i])}</text>`;
    const rows = s.series.map((se, j) => [se.name, nf(s.vals[i][j]), se.color]);
    hits += `<rect class="hit" x="${ml + band * i}" y="${mt - 14}" width="${band}" height="${ph + 14}" rx="4"${tipAttr({t: c.tip || c.label, r: rows, f: s.series.length > 1 ? "Tổng: " + nf(totals[i]) : ""})}/>`;
  });

// Thanh ngang: rows = [{label, vals:[...], tip?, go?}], series = [{name,color}]
function hbars(rows, series, opt = {}){

      }).join("")}</div></div>`).join("")}</div>`;

function donut(segs, center, sub){
  const total = segs.reduce((a, s) => a + s.v, 0), R = 64, r = 44, C = 76;
  let a0 = -Math.PI / 2, paths = "";
  const pad = segs.filter(s => s.v).length > 1 ? 0.025 : 0;
  segs.forEach(s => {
    if(!s.v) return;
    const a1 = a0 + s.v / total * Math.PI * 2;
    const b0 = a0 + pad, b1 = Math.max(b0 + 0.001, a1 - pad), big = b1 - b0 > Math.PI ? 1 : 0;
    const P = (rad, ang) => `${(C + rad * Math.cos(ang)).toFixed(2)},${(C + rad * Math.sin(ang)).toFixed(2)}`;
    const d = b1 - b0 >= Math.PI * 2 - 0.01
      ? `M${C - R},${C}a${R},${R} 0 1,0 ${2 * R},0a${R},${R} 0 1,0 ${-2 * R},0M${C - r},${C}a${r},${r} 0 1,1 ${2 * r},0a${r},${r} 0 1,1 ${-2 * r},0`
      : `M${P(R, b0)}A${R},${R} 0 ${big} 1 ${P(R, b1)}L${P(r, b1)}A${r},${r} 0 ${big} 0 ${P(r, b0)}Z`;
    paths += `<path d="${d}" style="fill:${s.color}" fill-rule="evenodd" class="seg-p"${tipAttr({t: s.name, r: [[s.name, nf(s.v) + " (" + pct(s.v, total) + "%)", s.color]]})}/>`;
    a0 = a1;
  });
  if(!total) paths = `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" style="fill:none;stroke:var(--surface-3)" stroke-width="${R - r}"/>`;
  return `<div class="donut-wrap"><svg width="152" height="152" viewBox="0 0 152 152" role="img" aria-label="${esc(center + " " + sub)}">${paths}
      <text x="76" y="74" text-anchor="middle" style="font-size:24px;font-weight:700;fill:var(--ink)">${esc(center)}</text>
      <text x="76" y="94" text-anchor="middle" style="font-size:11.5px;fill:var(--muted)">${esc(sub)}</text></svg>
    <div class="donut-legend">${segs.map(s => `<div><i style="background:${s.color}"></i><span>${esc(s.name)}</span><b>${nf(s.v)}</b><em>${pct(s.v, total)}%</em></div>`).join("")}</div></div>`;
}
function spark(vals, color = "var(--muted)"){
  const W = 92, H = 30, n = vals.length, max = Math.max(1, ...vals);
  if(n < 2) return "";
  const pts = vals.map((v, i) => [(i / (n - 1) * (W - 6) + 3).toFixed(1), (H - 4 - v / max * (H - 8)).toFixed(1)]);
  const last = pts[n - 1];
  return `<svg width="${W}" height="${H}" aria-hidden="true" style="flex:0 0 auto"><polyline style="fill:none;stroke:${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => p.join(",")).join(" ")}"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"/></svg>`;
}
function stackbar(parts){
  const total = parts.reduce((a, p) => a + p.v, 0) || 1;
  return `<div class="stackbar">${parts.filter(p => p.v).map(p => `<span style="width:${p.v / total * 100}%;background:${p.color}"${tipAttr({t: p.name, r: [[p.name, nf(p.v), p.color]]})}></span>`).join("")}</div>`;
}
function heatmap(rows, cols, cell, opt = {}){
  const max = Math.max(1, ...rows.flatMap(r => cols.map(c => cell(r, c))));
  const bin = v => v ? Math.min(5, 1 + Math.floor((v - 1) / max * 5)) : 0;
  return `<div class="tbl-wrap"><table class="heatmap"><thead><tr><th></th>${cols.map(c => `<th title="${esc(c.label)}">${esc(c.short || c.label)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr><th class="rh" title="${esc(r.label)}">${esc(r.label)}</th>${cols.map(c => { const v = cell(r, c);
      return `<td class="${v ? "q" + bin(v) : ""}"${tipAttr({t: r.label + " · " + c.label, r: [[opt.unit || "Số bài", nf(v), ""]]})}>${v || "·"}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="scale"><span>Ít</span>${[1,2,3,4,5].map(i => `<i class="q${i}"></i>`).join("")}<span>Nhiều (tối đa ${nf(max)})</span></div>`;
}
function card(title, sub, body, opt = {}){

function renderDrawer(){
  const root = document.getElementById("drawer-root"), d = S.drawer;
  const it = d && d.k === "item" ? D.items.find(x => x.id === d.id) : null;
  const src = d && d.k === "src" ? (D.nguon || []).find(x => x.id === d.id) : null;
  const key = it ? "item:" + it.id : src ? "src:" + src.id : "";
  if(!key) S.drawer = null;
  document.body.style.overflow = key ? "hidden" : "";
  if(key === renderDrawer.last) return;
  renderDrawer.last = key;
  if(!key){ root.innerHTML = ""; if(renderDrawer.from && document.body.contains(renderDrawer.from)) renderDrawer.from.focus(); return; }
  root.innerHTML = `<div class="drawer-bg" data-close></div>
    <aside class="card detail drawer" role="dialog" aria-modal="true" aria-label="${it ? "Chi tiết tin" : "Chi tiết nguồn"}" tabindex="-1">

}

function ideaMarkdown(it){
  const y = it.y_tuong || {};
  const L = [`# ${y.tieu_de_web || it.tieu_de}`, "", `- Tin gốc: [${it.tieu_de}](${it.url}) · ${it.nguon} · ${vnDate(it.ngay_dang || it.ngay_thu)}`,
             `- Lĩnh vực: ${fields(it)}${topics(it) ? " · Chủ đề: " + topics(it) : ""}`, `- Dạng tin: ${kindName(it)} · Dạng bài: ${fmtName(it)}`];
  if((it.so_hieu || []).length) L.push(`- Số hiệu: ${it.so_hieu.join(", ")} (${it.kiem_chung === "da" ? "đã kiểm chứng" : "chưa kiểm chứng"})`);
  if((it.can_cu || []).length) L.push(`- Căn cứ: ${it.can_cu.join("; ")}`);
  if(it.hieu_luc) L.push(`- Hiệu lực: ${vnDate(it.hieu_luc)}${it.hieu_luc_ghi_chu ? " (" + it.hieu_luc_ghi_chu + ")" : ""}`);
  (it.nguon_khac || []).forEach(o => L.push(`- Nguồn khác: [${o.nguon}](${o.url})`));
  if(it.tom_tat) L.push("", "## Tóm tắt", "", it.tom_tat);
  if((y.tu_khoa || []).length) L.push("", "## Từ khóa SEO", "", y.tu_khoa.join(", "));
  if(y.mo_dau_facebook) L.push("", "## Mở đầu Facebook", "", y.mo_dau_facebook);
  if((y.hoi_dap || []).length) L.push("", "## Hỏi đáp", "", ...y.hoi_dap.map(h => "- " + h));
  const f = fmtOf(it);
  if(f && f.giong_van){
    L.push("", "## Giọng văn: " + f.ten, "", f.giong_van);
    if((f.bo_cuc || []).length) L.push("", "Bố cục:", ...f.bo_cuc.map((x, i) => (i + 1) + ". " + x));
    if((f.tranh || []).length) L.push("", "Tránh:", ...f.tranh.map(x => "- " + x));
  }
  return L.join("\n");
}

function docStatus(it){

  if(!it.hieu_luc) return ["line", "Chưa xác định hiệu lực"];
  const n = dayDiff(D.ngay, it.hieu_luc);

  return ["good", "Đã có hiệu lực"];
}

function aiResult(t){
  const o = t.ra || {};
  if(t.trang_thai === "ai_bo_qua") return `<span class="muted">${esc(t.ly_do_bo_qua || "AI không làm được việc này")}</span>`;
  if(t.trang_thai === "bi_loai") return `<span style="color:var(--crit-ink)">${esc((t.loi || [])[0] || "Kết quả không đạt kiểm tra")}</span>`;
  if(!t.ra) return '<span class="muted">–</span>';
  switch(t.ma){
    case "LINH_VUC_MO": return "Lĩnh vực: <b>" + esc((o.linh_vuc || []).join(", ") || "–") + "</b>";
    case "DANG_TIN_MO": return "Dạng tin: <b>" + esc(o.dang_tin || "–") + "</b>";
    case "SO_HIEU_KHONG_THAY": return o.kiem_chung === "da" ? `Đã tìm thấy trên nguồn chính thống${o.url_kiem_chung ? " · " + ext(o.url_kiem_chung, "mở") : ""}` : "Chưa tìm thấy trên nguồn chính thống";
    case "HIEU_LUC_MO": return o.hieu_luc ? "Hiệu lực <b>" + vnDate(o.hieu_luc) + "</b>" + (o.hieu_luc_ghi_chu ? " · " + esc(o.hieu_luc_ghi_chu) : "") : "Không xác định được ngày hiệu lực";
    case "GOP_MO": return o.gop ? "<b>Gộp</b>: cùng một sự kiện, văn bản" : "<b>Không gộp</b>: hai tin khác nhau";
    case "KHOANG_TRONG_MO": return o.khoang_trong ? "<b>Đối thủ chưa viết</b>" : "Đối thủ đã viết";

    stats: [["Nhãn đối thủ khớp", a.so_bai ? pct(a.khop, a.so_bai) + "%" : "–"], ["Bài bỏ sót", nf((a.bo_sot || []).length)]]};
  return out;
}

// ---------- toàn cảnh: phòng máy và phòng nghỉ AI, góc nhìn chéo vẽ bằng SVG ----------
// Toạ độ tính theo ô: x dọc tường sau, y dọc tường trái, z chiều cao. Phòng máy x 0..MX, y 0..RH; phòng nghỉ nằm bên
// phải, lùi vào trong (y -RB..RF). Bot rảnh ngồi sạc ở ghế ngả phòng nghỉ; được giao việc thì đứng dậy, đi sang bàn.
const MX = 9.6, RH = 10, RX1 = 22.2, RB = 3.4, RF = 3.7, WH = 3.6, WT = 0.22, U = 46, CA = 0.9135, SA = 0.4067;
const OX = 448, OY = 200, SVGNS = "http://www.w3.org/2000/svg";
const IP = (x, y, z = 0) => [OX + (x - y) * CA * U, OY + (x + y) * SA * U - z * U];
const f1 = v => v.toFixed(1);
const ipts = a => a.map(p => f1(p[0]) + "," + f1(p[1])).join(" ");
const poly = (a, attrs = "") => `<polygon points="${ipts(a)}" ${attrs}/>`;
const iseg = (a, b) => `M${f1(a[0])} ${f1(a[1])}L${f1(b[0])} ${f1(b[1])}`;
const tr = p => `translate(${f1(p[0])} ${f1(p[1])})`;
const onY = p => `matrix(${CA} ${SA} 0 1 ${f1(p[0])} ${f1(p[1])})`;     // mặt song song trục x: tường sau, mặt hông bàn
const onX = p => `matrix(${CA} ${-SA} 0 1 ${f1(p[0])} ${f1(p[1])})`;    // mặt song song trục y: tường trái, màn hình bàn
const onF = p => `matrix(${CA} ${SA} ${-CA} ${SA} ${f1(p[0])} ${f1(p[1])})`;   // mặt sàn
const shadeC = (c, k) => `color-mix(in srgb,${c} ${k}%,#000)`;
function box(x, y, z, w, d, h, c, cls = ""){
  return `<g class="bx ${cls}">${poly([IP(x, y + d, z), IP(x + w, y + d, z), IP(x + w, y + d, z + h), IP(x, y + d, z + h)], `style="fill:${shadeC(c, 84)}"`)}${poly([IP(x + w, y, z), IP(x + w, y + d, z), IP(x + w, y + d, z + h), IP(x + w, y, z + h)], `style="fill:${shadeC(c, 70)}"`)}${poly([IP(x, y, z + h), IP(x + w, y, z + h), IP(x + w, y + d, z + h), IP(x, y + d, z + h)], `style="fill:${c}"`)}</g>`;
}
// Hai dãy bàn, mỗi dãy 4 bàn, bot quay mặt về tường bảng khâu; ghế sạc 01–04 sát tường gỗ, 05–08 trước vách lửng.
const FY = 9.25, EX = 8.3, X0 = [EX, 2.7], LANE = -0.72, GAPX = MX + 0.6, SLOT = 2.6;
function geo(i){
  const col = i % 2, row = 3 - (i >> 1), yc = 1.75 + row * 2, x0 = col ? 5 : 1.8, cx = x0 + 1.35, aisle = x0 + 2.15;
  const back = i < 4, rx = MX + 1.4 + (i % 4) * SLOT, ry = back ? -RB + 0.3 : 0.15;
  return {col, yc, x0, cx, aisle, seat: [cx - 0.05, yc], stand: [aisle, yc + 0.35], rx, ry, back, rest: [rx + 0.81, ry + 0.85]};
}

  <text class="z" x="16" y="-54" font-size="9" font-weight="700">z</text><text class="z z2" x="21" y="-62" font-size="7" font-weight="700">z</text>`;
function bubble3(s, y){

  return `<g class="bub3" transform="translate(0 ${y})"><g class="bf"><path d="M-12-10h24a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H4l-4 5-4-5h-8a4 4 0 0 1-4-4V-6a4 4 0 0 1 4-4z" style="fill:${c}" filter="url(#rm-drop)"/>${inner}</g></g>`;

function botAt(id, loc, s){
  const g = GEO[id], b = BOT[id], attrs = `class="rb ${loc} st-${s}" data-bot="${id}" data-tab="${b.tab}"${b.sub ? ` data-sub="${b.sub}"` : ""} style="--bot:${b.mau}"`;

// Dải LED: quầng mờ rộng bên ngoài, lõi sáng mảnh bên trong.

// Khối bo tròn: mỗi mặt có viền cùng màu nét tròn, khối thu vào nửa nét để giữ kích thước; dùng cho đồ bọc nệm.
function sbox(x, y, z, w, d, h, c, r = 6){
  const k = r / 2 / U; x += k; y += k; z += k; w -= 2 * k; d -= 2 * k; h -= 2 * k;
  const st = col => `style="fill:${col};stroke:${col}" stroke-width="${r}" stroke-linejoin="round"`;
  return `<g class="sb">${poly([IP(x, y + d, z), IP(x + w, y + d, z), IP(x + w, y + d, z + h), IP(x, y + d, z + h)], st(shadeC(c, 78)))}${poly([IP(x + w, y, z), IP(x + w, y + d, z), IP(x + w, y + d, z + h), IP(x + w, y, z + h)], st(shadeC(c, 60)))}${poly([IP(x, y, z + h), IP(x + w, y, z + h), IP(x + w, y + d, z + h), IP(x, y + d, z + h)], st(c))}</g>`;
}
const sheen = (a, c, o = .18) => `<path d="${iseg(a, c)}" stroke="#fff" stroke-opacity="${o}" stroke-width="1.6" stroke-linecap="round"/>`;
// Ghế thư giãn bọc da: lưng ngả chần ô, gối đầu rời, tay vịn dày bo tròn, đệm ngồi và gác chân bật ra.
function recliner(X, Y){
  const L = "#3a3f4a", L2 = "#474d5a", xa = X + 0.26, xb = X + 1.36, st = c => `style="fill:${c};stroke:${c}" stroke-width="8" stroke-linejoin="round"`;
  const f = [IP(xa, Y + 0.6, 0.45), IP(xb, Y + 0.6, 0.45), IP(xb, Y + 0.2, 1.3), IP(xa, Y + 0.2, 1.3)];

let ROOM = null, ROOM_GEN = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const $id = id => document.getElementById(id);
function setGlow(id, on){ const el = $id(id); if(el) el.classList.toggle("on", !!on); }
function place(id, loc, s){
  for(const k of ["sb-", "ss-", "sd-"]){ const el = $id(k + id); if(el) el.innerHTML = ""; }
  const slot = $id({bed: "sb-", seat: "ss-", stand: "sd-"}[loc] + id);
  if(slot) slot.innerHTML = botAt(id, loc, s);
  const bed = $id("bd-" + id), desk = $id("dk-" + id);
  if(bed) bed.classList.toggle("empty", loc !== "bed");
  if(desk) desk.setAttribute("class", "dk " + (loc === "bed" ? "off" : DESK_CL[s]));
  setGlow("dg-" + id, loc !== "bed"); setGlow("sg-" + id, loc === "seat" && s === "lam"); setGlow("nl-" + id, loc === "bed");
  const nlb = $id("nlb-" + id); if(nlb) nlb.classList.toggle("on", loc === "bed");
}
function leave(id, from){
  for(const k of ["sb-", "ss-", "sd-"]){ const el = $id(k + id); if(el) el.innerHTML = ""; }
  if(from === "bed"){ const bed = $id("bd-" + id); if(bed) bed.classList.add("empty"); setGlow("nl-" + id, false); const nlb = $id("nlb-" + id); if(nlb) nlb.classList.remove("on"); }
  else { const desk = $id("dk-" + id); if(desk) desk.setAttribute("class", "dk off"); setGlow("dg-" + id, false); setGlow("sg-" + id, false); }
}
function walkSeg(w, a, c, speed, gen){
  return new Promise(res => {
    const T = Math.max(60, Math.hypot(c[0] - a[0], c[1] - a[1]) / speed * 1000), t0 = performance.now();
    const step = t => {
      if(!w.isConnected || !ROOM || ROOM.gen !== gen) return res(false);
      const k = Math.min(1, (t - t0) / T);
      const px = a[0] + (c[0] - a[0]) * k, py = a[1] + (c[1] - a[1]) * k;
      w.setAttribute("transform", tr(IP(px, py)));
      if(k < 1) requestAnimationFrame(step); else res(true);
    };
    requestAnimationFrame(step);
  });
}
// Lối đi từ một chỗ tới điểm giao X0 giữa hai phòng. Ghế sạc dãy sau: ra lối sau, vòng qua đầu vách lửng.
// Bàn dãy trong: ra lối dọc, xuống lối ngang phía trước rồi sang lối dọc sát phòng nghỉ.
function chain(id, loc){
  const g = GEO[id];
  if(loc === "bed") return g.back ? [g.rest, [g.rest[0], LANE], [GAPX, LANE], [GAPX, X0[1]], X0] : [g.rest, [g.rest[0], X0[1]], X0];
  const head = [loc === "seat" ? g.seat : g.stand, [g.aisle, g.yc]];
  return g.col ? [...head, [EX, g.yc], X0] : [...head, [g.aisle, FY], [EX, FY], X0];
}
// Đi từ chỗ cũ tới chỗ mới: ghế sạc → lối đi phòng nghỉ → phòng máy → ghế làm việc; đoạn chung của hai chuỗi bị cắt.
async function move(id, from, to, gen){
  const b = BOT[id], s = ROOM.bots[id].want.s, A = chain(id, from), B = chain(id, to);
  const same = (p, q) => Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) < 1e-6;
  while(A.length > 1 && B.length > 1 && same(A[A.length - 2], B[B.length - 2])){ A.pop(); B.pop(); }
  const path = [...A, ...B.reverse().slice(1)];
  leave(id, from);
  if(reduceMotion()) return true;
  const layer = $id("rm-walk"); if(!layer) return false;
  const w = document.createElementNS(SVGNS, "g");
  w.setAttribute("class", "rb walk st-" + s); w.setAttribute("style", "--bot:" + b.mau);
  w.dataset.bot = id; w.dataset.tab = b.tab; if(b.sub) w.dataset.sub = b.sub;
  w.setAttribute("transform", tr(IP(path[0][0], path[0][1])));
  layer.appendChild(w);
  if(from === "bed"){ w.innerHTML = `<g transform="scale(1.05)">${standSprite(s, {eyes: "happy", arms: "up"})}</g>`; w.classList.remove("walk"); await wait(650); w.classList.add("walk"); }
  const speed = DEMO ? 3.4 : 2.4;
  for(let i = 1; i < path.length; i++){
    const a = path[i - 1], c = path[i];
    if(Math.hypot(c[0] - a[0], c[1] - a[1]) < 0.01) continue;
    w.innerHTML = `<g transform="scale(1.05)">${standSprite(s, {back: c[0] < a[0] - 0.01 || c[1] < a[1] - 0.01})}</g>`;
    if(!(await walkSeg(w, a, c, speed, gen))) return false;
  }
  w.remove();
  return true;
}
async function drive(id){
  const R = ROOM, r = R.bots[id];
  if(r.busy) return;
  r.busy = true;
  while(ROOM === R && r.want.loc !== r.loc){
    const to = r.want.loc;
    if(!(await move(id, r.loc, to, R.gen))) return;
    r.loc = to; r.s = r.want.s; place(id, to, r.s);
    await wait(350);
  }
  r.busy = false;
  if(ROOM === R && r.s !== r.want.s){ r.s = r.want.s; place(id, r.loc, r.s); }
}

function showTip(el, x, y){
  let d; try { d = JSON.parse(el.dataset.tip); } catch(e) { return; }
  tip.replaceChildren();
  const h = document.createElement("div"); h.className = "tt"; h.textContent = d.t; tip.append(h);

    const b = document.createElement("b"); b.textContent = v; const s = document.createElement("span"); s.textContent = k; r.append(b, s); tip.append(r); });
  if(d.f){ const f = document.createElement("div"); f.className = "tf"; f.textContent = d.f; tip.append(f); }
  tip.hidden = false;
  const w = tip.offsetWidth, hh = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 14)) + "px";
  tip.style.top = Math.max(8, y - hh - 12 < 8 ? y + 18 : y - hh - 12) + "px";
}

  let t = null;
  try { t = localStorage.getItem("radar-theme"); } catch(e) {}
  setTheme(t === "light" || t === "dark" ? t : null);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if(!document.documentElement.dataset.theme) setTheme(null); if(D) drawCharts(); });
  let pw = null;
  try { pw = sessionStorage.getItem("radar-pw"); } catch(e) {}
  if(pw){ try { await open(pw); } catch(e) { try { sessionStorage.removeItem("radar-pw"); } catch(_) {} } }
})();
</script>
