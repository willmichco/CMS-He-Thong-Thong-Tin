function niceTicks(max, n = 4){
  max = Math.max(1, max);
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = Math.max(1, [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw));
  const out = [];
  for(let v = 0; v < max + step; v += step){ out.push(v); if(v >= max) break; }
  return out;
}
function legend(series, line){
  return `<div class="legend">${series.map(s => `<span><i class="${line ? "ln" : ""}" style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}
// Cột (chồng): spec = {cats:[{label, tip}], series:[{name,color}], vals:[[...]], h}
function colChart(spec){
  CH.push(spec);
  return `<div class="chart" data-ci="${CH.length - 1}" style="height:${spec.h || 220}px"></div>`;
}
function colSVG(s, W){
  const H = s.h || 220, n = s.cats.length;
  if(!n || W < 60) return "";
  const totals = s.vals.map(v => v.reduce((a, b) => a + b, 0));
  const ticks = niceTicks(Math.max(...totals)), top = ticks[ticks.length - 1];
  const ml = 14 + 7 * nf(top).length, mr = 6, mt = 20, mb = 26;
  const pw = W - ml - mr, ph = H - mt - mb, band = pw / n, bw = Math.max(3, Math.min(24, band * 0.62));
  const y = v => mt + ph - v / top * ph;
  let g = "";
  ticks.forEach(t => { const yy = Math.round(y(t)) + .5;
    g += `<line class="${t === 0 ? "axis-l" : "grid-l"}" x1="${ml}" x2="${W - mr}" y1="${yy}" y2="${yy}"/><text class="tick" x="${ml - 8}" y="${yy + 4}" text-anchor="end">${nf(t)}</text>`; });
  const every = Math.max(1, Math.ceil(n * (s.lw || 44) / pw));
  const maxI = totals.indexOf(Math.max(...totals));
  let bars = "", hits = "";
  s.cats.forEach((c, i) => {
    const cx = ml + band * i + band / 2, x = cx - bw / 2;
    if((n - 1 - i) % every === 0) g += `<text class="tick" x="${cx}" y="${H - 8}" text-anchor="middle">${esc(c.label)}</text>`;
    let base = y(0), last = -1, first = true;
    s.vals[i].forEach((v, j) => { if(v > 0) last = j; });
    s.vals[i].forEach((v, j) => {
      if(v <= 0) return;
      const full = v / top * ph, gap = first ? 0 : 2, h = Math.max(1, full - gap), yT = base - gap - h;
      const r = j === last ? Math.min(4, bw / 2, h) : 0;
      bars += `<path style="fill:${s.series[j].color}" d="M${x},${yT + h}V${yT + r}${r ? `Q${x},${yT} ${x + r},${yT}H${x + bw - r}Q${x + bw},${yT} ${x + bw},${yT + r}` : `H${x + bw}`}V${yT + h}Z"/>`;
      base = yT; first = false;
    });
    if(totals[i] > 0 && (i === n - 1 || i === maxI)) bars += `<text class="val" x="${cx}" y="${base - 6}" text-anchor="middle">${nf(totals[i])}</text>`;
    const rows = s.series.map((se, j) => [se.name, nf(s.vals[i][j]), se.color]);
    hits += `<rect class="hit" x="${ml + band * i}" y="${mt - 14}" width="${band}" height="${ph + 14}" rx="4"${tipAttr({t: c.tip || c.label, r: rows, f: s.series.length > 1 ? "Tổng: " + nf(totals[i]) : ""})}/>`;
  });
  return `<svg width="${W}" height="${H}" role="img" aria-label="${esc(s.label || "")}">${g}${bars}${hits}</svg>`;
}

// Thanh ngang: rows = [{label, vals:[...], tip?, go?}], series = [{name,color}]
function hbars(rows, series, opt = {}){

      r: series.map((s, j) => [s.name, nf(r.vals[j]), s.color])})}>

function donut(segs, center, sub){
  const total = segs.reduce((a, s) => a + s.v, 0), R = 64, r = 44, C = 76;
  let a0 = -Math.PI / 2, paths = "";
  const pad = segs.filter(s => s.v).length > 1 ? 0.025 : 0;
  segs.forEach(s => {
    if(!s.v) return;
    const a1 = a0 + s.v / total * Math.PI * 2;
    const b0 = a0 + pad, b1 = Math.max(b0 + 0.001, a1 - pad), big = b1 - b0 > Math.PI ? 1 : 0;
    const P = (rad, ang) => `${(C + rad * Math.cos(ang)).toFixed(2)},${(C + rad * Math.sin(ang)).toFixed(2)}`;
    const d = b1 - b0 >= Math.PI * 2 - 0.01
      ? `M${C - R},${C}a${R},${R} 0 1,0 ${2 * R},0a${R},${R} 0 1,0 ${-2 * R},0M${C - r},${C}a${r},${r} 0 1,1 ${2 * r},0a${r},${r} 0 1,1 ${-2 * r},0`
      : `M${P(R, b0)}A${R},${R} 0 ${big} 1 ${P(R, b1)}L${P(r, b1)}A${r},${r} 0 ${big} 0 ${P(r, b0)}Z`;
    paths += `<path d="${d}" style="fill:${s.color}" fill-rule="evenodd" class="seg-p"${tipAttr({t: s.name, r: [[s.name, nf(s.v) + " (" + pct(s.v, total) + "%)", s.color]]})}/>`;
    a0 = a1;
  });
  if(!total) paths = `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" style="fill:none;stroke:var(--surface-3)" stroke-width="${R - r}"/>`;
  return `<div class="donut-wrap"><svg width="152" height="152" viewBox="0 0 152 152" role="img" aria-label="${esc(center + " " + sub)}">${paths}
      <text x="76" y="74" text-anchor="middle" style="font-size:24px;font-weight:700;fill:var(--ink)">${esc(center)}</text>
      <text x="76" y="94" text-anchor="middle" style="font-size:11.5px;fill:var(--muted)">${esc(sub)}</text></svg>
    <div class="donut-legend">${segs.map(s => `<div><i style="background:${s.color}"></i><span>${esc(s.name)}</span><b>${nf(s.v)}</b><em>${pct(s.v, total)}%</em></div>`).join("")}</div></div>`;
}
function spark(vals, color = "var(--muted)"){

// của bài đang mở. Phần tử có data-anh nhận blob URL: <img> làm src, <a> làm href (mở cỡ thật, tải về).
const ANH_URL = new Map();
function anhUrl(file){
  if(!ANH_URL.has(file)){
    const p = (async () => {
      const res = await fetch("anh/" + file, {cache: "force-cache"});
      if(!res.ok) throw new Error("HTTP " + res.status);
      const buf = new Uint8Array(await res.arrayBuffer());
      const png = await crypto.subtle.decrypt({name: "AES-GCM", iv: buf.slice(0, 12)}, DK, buf.slice(12));
      return URL.createObjectURL(new Blob([png], {type: "image/png"}));
    })();
    p.catch(() => ANH_URL.delete(file));
    ANH_URL.set(file, p);
  }
  return ANH_URL.get(file);
}

// Sổ quét cộng dồn (data/so-quet.json, giữ vĩnh viễn): ky = số ngày gần nhất, 0 là từ ngày đầu
const SQ_KY = [[1, "Hôm nay"], [7, "7 ngày"], [30, "30 ngày"], [0, "Từ đầu"]];
const LOAI_BO = {nhieu: "Nhiễu (quảng cáo, tin rác)", khong_phap_ly: "Không phải tin pháp lý", thieu_tu_khoa: "Thiếu từ khóa bắt buộc của nguồn"};
const SQ_MAU = {da_thay: "var(--neutral)", bi_loai: "var(--crit)", moi: "var(--s3)", ai: "#f08a3c"};
function sqDays(ky){
  const N = (D.so_quet || {}).ngay || {};
  return Object.keys(N).sort().filter(d => !ky || dayDiff(d, D.ngay) < ky).map(d => ({ngay: d, ...N[d]}));
}
function sqSum(days){
  const K = ["luot", "doc_nguon", "loi", "rong", "doc_duoc", "da_thay", "bi_loai", "moi", "vao_kho", "dt_doc", "dt_moi"];
  const t = {ngay: 0, ai_viec: 0, ai_doc: 0, ai_tin: 0, ai_vao_kho: 0, loai_bo: {}, nguon: {}, ai_nguon: {}};
  K.forEach(k => t[k] = 0);
  const add = (into, key, v) => { const r = into[key] || (into[key] = v.map(() => 0)); v.forEach((x, i) => r[i] += x); };
  days.forEach(d => {
    if(d.luot) t.ngay++;
    K.forEach(k => t[k] += d[k] || 0);
    const a = d.ai || {};
    t.ai_viec += a.viec || 0; t.ai_doc += a.doc || 0; t.ai_tin += a.tin || 0; t.ai_vao_kho += a.vao_kho || 0;
    Object.entries(d.loai_bo || {}).forEach(([k, v]) => t.loai_bo[k] = (t.loai_bo[k] || 0) + v);
    Object.entries(d.nguon || {}).forEach(([k, v]) => add(t.nguon, k, v));
    Object.entries(a.nguon || {}).forEach(([k, v]) => add(t.ai_nguon, k, v));
  });
  return t;
}
const sqKyTxt = ky => ky ? (SQ_KY.find(k => k[0] === ky) || [, ky + " ngày"])[1].toLowerCase() : "từ " + dm((D.so_quet || {}).bat_dau || D.ngay);
function sqTile(lab, val, sub, color){
  return `<div class="kpi"><span class="lab">${color ? `<i class="sq-dot" style="background:${color}"></i>` : ""}${lab}</span><span class="val">${val}</span><span class="sub">${sub}</span></div>`;
}
function scanTotals(){
  const ky = S.ai.ky, days = sqDays(ky), t = sqSum(days);
  if(!days.length) return card("Tổng số liệu quét", "", empty("Sổ quét chưa có ngày nào. Số liệu có sau lượt thu tin kế tiếp."));
  const ok = t.doc_nguon - t.loi - t.rong, chuaThay = t.bi_loai + t.moi;
  const reasons = Object.entries(t.loai_bo).sort((a, b) => b[1] - a[1]);
  const tiles = [
    sqTile("Lượt quét", nf(t.luot), `${nf(t.ngay)} ngày có quét · trung bình ${(t.luot / Math.max(1, t.ngay)).toFixed(1).replace(".", ",")} lượt/ngày`),
    sqTile("Lượt đọc nguồn", nf(t.doc_nguon), `${pct(ok, t.doc_nguon)}% đọc được${t.loi ? ` · ${nf(t.loi)} lượt lỗi` : " · không lỗi"}${t.rong ? ` · ${nf(t.rong)} trang rỗng` : ""}`),
    sqTile("Mục đọc được", nf(t.doc_duoc), "cộng qua các lượt; trang danh sách đọc lại cùng mục nhiều lần"),
    sqTile("Bỏ qua vì đã gặp", nf(t.da_thay), `${pct(t.da_thay, t.doc_duoc)}% mục đọc được · đã có từ lượt trước`, SQ_MAU.da_thay),
    sqTile("Bị loại khi lọc", nf(t.bi_loai), `${pct(t.bi_loai, chuaThay)}% tin chưa từng thấy${reasons.length ? " · nhiều nhất: " + esc((LOAI_BO[reasons[0][0]] || reasons[0][0]).toLowerCase()) : ""}`, SQ_MAU.bi_loai),
    sqTile("Tin mới giữ lại", nf(t.moi), `${nf(t.vao_kho)} tin vào Kho tin sau gộp trùng`, SQ_MAU.moi),
    sqTile("AI đọc thay", `${nf(t.ai_doc)}<small> lượt</small>`, `${nf(t.ai_tin)} tin tìm được · ${nf(t.ai_vao_kho)} vào kho · ${nf(t.ai_viec)} việc giao`, SQ_MAU.ai),
    sqTile("Trang đối thủ", `${nf(t.dt_moi)}<small> bài mới</small>`, `${nf(t.dt_doc)} mục đọc trên RSS, sitemap`)];
  const parts = [["da_thay", "Đã gặp, bỏ qua", t.da_thay], ["bi_loai", "Bị loại khi lọc", t.bi_loai], ["moi", "Giữ lại", t.moi]];
  const bar = `<div class="sq-bar">${parts.filter(p => p[2]).map(([k, n, v]) => `<span style="flex:${v} 1 0;background:${SQ_MAU[k]}"${tipAttr({t: n, r: [[n, nf(v) + " (" + pct(v, t.doc_duoc) + "%)", SQ_MAU[k]]]})}></span>`).join("")}</div>
    <div class="sq-leg">${parts.map(([k, n, v]) => `<span><i style="background:${SQ_MAU[k]}"></i>${n}<b>${nf(v)}</b><em>${pct(v, t.doc_duoc)}%</em></span>`).join("")}</div>`;
  const step = (lab, v, of, note) => `<div class="sq-step"><span>${lab}</span><b>${nf(v)}</b>${of != null ? `<em>${pct(v, of)}% bước trước</em>` : ""}${note ? `<em>${note}</em>` : ""}</div>`;
  const path = `<div class="sq-path">${step("Mục đọc được", t.doc_duoc)}${step("Chưa từng thấy", chuaThay, t.doc_duoc)}${step("Qua lọc pháp lý", t.moi, chuaThay)}
    ${step("Vào Kho tin", t.vao_kho, null, `${t.moi + t.ai_vao_kho > t.vao_kho ? nf(t.moi + t.ai_vao_kho - t.vao_kho) + " tin gộp trùng" : "sau gộp trùng"}${t.ai_vao_kho ? ` · gồm ${nf(t.ai_vao_kho)} tin AI đọc thay` : ""}`)}</div>`;
  const why = reasons.length ? `<p class="note">Lý do loại: ${reasons.map(([k, v]) => `${esc(LOAI_BO[k] || k)} <b>${nf(v)}</b>`).join(" · ")}.</p>` : "";
  return card("Tổng số liệu quét", `${days.length === 1 ? vnDate(days[0].ngay) : `${vnDate(days[0].ngay)} – ${vnDate(days[days.length - 1].ngay)}`} · cộng từ sổ quét, giữ vĩnh viễn`,
    `<div class="kpis k4">${tiles.join("")}</div><h3 class="sq-h">Mục đọc được đi đâu</h3>${bar}${path}${why}`,
    {acts: seg("sq-ky", ky, SQ_KY), cls: "sq-card"});
}

const vnParts = ms => { const d = new Date(ms + VN_OFF); return {y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), dow: d.getUTCDay(), h: d.getUTCHours(), mi: d.getUTCMinutes()}; };

// ---------- toàn cảnh: phòng máy và phòng nghỉ AI, góc nhìn chéo vẽ bằng SVG ----------
// Toạ độ tính theo ô: x dọc tường sau, y dọc tường trái, z chiều cao. Phòng máy x 0..MX, y 0..RH; phòng nghỉ nằm bên
// phải, lùi vào trong (y -RB..RF). Bot rảnh ngồi sạc ở ghế ngả phòng nghỉ; được giao việc thì đứng dậy, đi sang bàn.
const MX = 9.6, RH = 10, RX1 = 22.2, RB = 3.4, RF = 3.7, WH = 3.6, WT = 0.22, U = 46, CA = 0.9135, SA = 0.4067;
const OX = 448, OY = 200, SVGNS = "http://www.w3.org/2000/svg";
const IP = (x, y, z = 0) => [OX + (x - y) * CA * U, OY + (x + y) * SA * U - z * U];
const f1 = v => v.toFixed(1);
const ipts = a => a.map(p => f1(p[0]) + "," + f1(p[1])).join(" ");
const poly = (a, attrs = "") => `<polygon points="${ipts(a)}" ${attrs}/>`;
const iseg = (a, b) => `M${f1(a[0])} ${f1(a[1])}L${f1(b[0])} ${f1(b[1])}`;
const tr = p => `translate(${f1(p[0])} ${f1(p[1])})`;
const onY = p => `matrix(${CA} ${SA} 0 1 ${f1(p[0])} ${f1(p[1])})`;     // mặt song song trục x: tường sau, mặt hông bàn
const onX = p => `matrix(${CA} ${-SA} 0 1 ${f1(p[0])} ${f1(p[1])})`;    // mặt song song trục y: tường trái, màn hình bàn
const onF = p => `matrix(${CA} ${SA} ${-CA} ${SA} ${f1(p[0])} ${f1(p[1])})`;   // mặt sàn
const shadeC = (c, k) => `color-mix(in srgb,${c} ${k}%,#000)`;
function box(x, y, z, w, d, h, c, cls = ""){
  return `<g class="bx ${cls}">${poly([IP(x, y + d, z), IP(x + w, y + d, z), IP(x + w, y + d, z + h), IP(x, y + d, z + h)], `style="fill:${shadeC(c, 84)}"`)}${poly([IP(x + w, y, z), IP(x + w, y + d, z), IP(x + w, y + d, z + h), IP(x + w, y, z + h)], `style="fill:${shadeC(c, 70)}"`)}${poly([IP(x, y, z + h), IP(x + w, y, z + h), IP(x + w, y + d, z + h), IP(x, y + d, z + h)], `style="fill:${c}"`)}</g>`;
}

// Khối bo tròn: mỗi mặt có viền cùng màu nét tròn, khối thu vào nửa nét để giữ kích thước; dùng cho đồ bọc nệm.
function sbox(x, y, z, w, d, h, c, r = 6){
  const k = r / 2 / U; x += k; y += k; z += k; w -= 2 * k; d -= 2 * k; h -= 2 * k;
  const st = col => `style="fill:${col};stroke:${col}" stroke-width="${r}" stroke-linejoin="round"`;
  return `<g class="sb">${poly([IP(x, y + d, z), IP(x + w, y + d, z), IP(x + w, y + d, z + h), IP(x, y + d, z + h)], st(shadeC(c, 78)))}${poly([IP(x + w, y, z), IP(x + w, y + d, z), IP(x + w, y + d, z + h), IP(x + w, y, z + h)], st(shadeC(c, 60)))}${poly([IP(x, y, z + h), IP(x + w, y, z + h), IP(x + w, y + d, z + h), IP(x, y + d, z + h)], st(c))}</g>`;
}
const sheen = (a, c, o = .18) => `<path d="${iseg(a, c)}" stroke="#fff" stroke-opacity="${o}" stroke-width="1.6" stroke-linecap="round"/>`;
// Ghế thư giãn bọc da: lưng ngả chần ô, gối đầu rời, tay vịn dày bo tròn, đệm ngồi và gác chân bật ra.
function recliner(X, Y){
  const L = "#3a3f4a", L2 = "#474d5a", xa = X + 0.26, xb = X + 1.36, st = c => `style="fill:${c};stroke:${c}" stroke-width="8" stroke-linejoin="round"`;

  const side = [IP(xb, Y + 0.6, 0.45), IP(xb, Y + 0.2, 1.3), IP(xb, Y - 0.08, 1.3), IP(xb, Y + 0.25, 0.25), IP(xb, Y + 0.6, 0.25)];

  const ch = t => iseg(IP(xa + (xb - xa) * t, Y + 0.56, 0.52), IP(xa + (xb - xa) * t, Y + 0.24, 1.22));
  const before = `${poly([IP(X - 0.15, Y - 0.05), IP(X + 2.45, Y - 0.05), IP(X + 2.45, Y + 2.15), IP(X - 0.15, Y + 2.15)], 'fill="#17181e" fill-opacity=".92"')}

    <path d="${ch(1 / 3)}${ch(2 / 3)}${iseg(IP(xa, Y + 0.42, 0.85), IP(xb, Y + 0.42, 0.85))}" stroke="#000" stroke-opacity=".3" stroke-width="1.3" stroke-linecap="round"/>
    ${sheen(IP(xa + 0.05, Y + 0.18, 1.33), IP(xb - 0.05, Y + 0.18, 1.33), .14)}
    ${sbox(xa + 0.1, Y - 0.06, 1.2, xb - xa - 0.2, 0.42, 0.36, L2, 13)}${sheen(IP(xa + 0.18, Y + 0.33, 1.53), IP(xb - 0.18, Y + 0.33, 1.53), .22)}
    ${sbox(X + 0.22, Y + 0.48, 0.18, 1.18, 1.02, 0.3, L, 10)}${sheen(IP(X + 0.3, Y + 1.47, 0.49), IP(X + 1.32, Y + 1.47, 0.49))}

    ${box(X + 1.62, Y + 1.0, 0.25, 0.04, 0.05, 0.2, "#8a93a3")}`;
  return [before, after];
}

let ROOM = null, ROOM_GEN = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const $id = id => document.getElementById(id);
function setGlow(id, on){ const el = $id(id); if(el) el.classList.toggle("on", !!on); }
function place(id, loc, s){
  for(const k of ["sb-", "ss-", "sd-"]){ const el = $id(k + id); if(el) el.innerHTML = ""; }
  const slot = $id({bed: "sb-", seat: "ss-", stand: "sd-"}[loc] + id);
  if(slot) slot.innerHTML = botAt(id, loc, s);
  const bed = $id("bd-" + id), desk = $id("dk-" + id);
  if(bed) bed.classList.toggle("empty", loc !== "bed");
  if(desk) desk.setAttribute("class", "dk " + (loc === "bed" ? "off" : DESK_CL[s]));
  setGlow("dg-" + id, loc !== "bed"); setGlow("sg-" + id, loc === "seat" && s === "lam"); setGlow("nl-" + id, loc === "bed");
  const nlb = $id("nlb-" + id); if(nlb) nlb.classList.toggle("on", loc === "bed");
}
function leave(id, from){
  for(const k of ["sb-", "ss-", "sd-"]){ const el = $id(k + id); if(el) el.innerHTML = ""; }
  if(from === "bed"){ const bed = $id("bd-" + id); if(bed) bed.classList.add("empty"); setGlow("nl-" + id, false); const nlb = $id("nlb-" + id); if(nlb) nlb.classList.remove("on"); }
  else { const desk = $id("dk-" + id); if(desk) desk.setAttribute("class", "dk off"); setGlow("dg-" + id, false); setGlow("sg-" + id, false); }
}
function walkSeg(w, a, c, speed, gen){
  return new Promise(res => {
    const T = Math.max(60, Math.hypot(c[0] - a[0], c[1] - a[1]) / speed * 1000), t0 = performance.now();
    const step = t => {
      if(!w.isConnected || !ROOM || ROOM.gen !== gen) return res(false);
      const k = Math.min(1, (t - t0) / T);
      const px = a[0] + (c[0] - a[0]) * k, py = a[1] + (c[1] - a[1]) * k;
      w.setAttribute("transform", tr(IP(px, py)));
      if(k < 1) requestAnimationFrame(step); else res(true);
    };
    requestAnimationFrame(step);
  });
}
// Lối đi từ một chỗ tới điểm giao X0 giữa hai phòng. Ghế sạc dãy sau: ra lối sau, vòng qua đầu vách lửng.
// Bàn dãy trong: ra lối dọc, xuống lối ngang phía trước rồi sang lối dọc sát phòng nghỉ.
function chain(id, loc){
  const g = GEO[id];
  if(loc === "bed") return g.back ? [g.rest, [g.rest[0], LANE], [GAPX, LANE], [GAPX, X0[1]], X0] : [g.rest, [g.rest[0], X0[1]], X0];
  const head = [loc === "seat" ? g.seat : g.stand, [g.aisle, g.yc]];
  return g.col ? [...head, [EX, g.yc], X0] : [...head, [g.aisle, FY], [EX, FY], X0];
}
// Đi từ chỗ cũ tới chỗ mới: ghế sạc → lối đi phòng nghỉ → phòng máy → ghế làm việc; đoạn chung của hai chuỗi bị cắt.
async function move(id, from, to, gen){
  const b = BOT[id], s = ROOM.bots[id].want.s, A = chain(id, from), B = chain(id, to);
  const same = (p, q) => Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) < 1e-6;
  while(A.length > 1 && B.length > 1 && same(A[A.length - 2], B[B.length - 2])){ A.pop(); B.pop(); }
  const path = [...A, ...B.reverse().slice(1)];
  leave(id, from);
  if(reduceMotion()) return true;
  const layer = $id("rm-walk"); if(!layer) return false;
  const w = document.createElementNS(SVGNS, "g");
  w.setAttribute("class", "rb walk st-" + s); w.setAttribute("style", "--bot:" + b.mau);
  w.dataset.bot = id; w.dataset.tab = b.tab; if(b.sub) w.dataset.sub = b.sub;
  w.setAttribute("transform", tr(IP(path[0][0], path[0][1])));
  layer.appendChild(w);
  if(from === "bed"){ w.innerHTML = `<g transform="scale(1.05)">${standSprite(s, {eyes: "happy", arms: "up"})}</g>`; w.classList.remove("walk"); await wait(650); w.classList.add("walk"); }
  const speed = DEMO ? 3.4 : 2.4;
  for(let i = 1; i < path.length; i++){
    const a = path[i - 1], c = path[i];
    if(Math.hypot(c[0] - a[0], c[1] - a[1]) < 0.01) continue;
    w.innerHTML = `<g transform="scale(1.05)">${standSprite(s, {back: c[0] < a[0] - 0.01 || c[1] < a[1] - 0.01})}</g>`;
    if(!(await walkSeg(w, a, c, speed, gen))) return false;
  }
  w.remove();
  return true;
}
async function drive(id){
  const R = ROOM, r = R.bots[id];
  if(r.busy) return;
  r.busy = true;
  while(ROOM === R && r.want.loc !== r.loc){
    const to = r.want.loc;
    if(!(await move(id, r.loc, to, R.gen))) return;
    r.loc = to; r.s = r.want.s; place(id, to, r.s);
    await wait(350);
  }
  r.busy = false;
  if(ROOM === R && r.s !== r.want.s){ r.s = r.want.s; place(id, r.loc, r.s); }
}

function dayPlan(st){
  const T = D.ngay, q = aiDay(T) || {}, p = vnParts(Date.now()), isMon = p.dow === 1, nowMin = vnToday() === T ? p.h * 60 + p.mi : null;
  const scans = (NK.luot || []).filter(r => r.ngay === T).map(r => { const [h, m] = r.luot.slice(11, 16).split(":").map(Number); return h * 60 + m; });
  // GitHub hay chạy lịch trễ: lượt thu sáng tính là đã chạy nếu có lượt nào tới 10:00 (AI 08:05 tự kích hoạt nếu thiếu)
  const ran = (t, span = 150) => scans.some(m => m >= t - 30 && m <= t + span);
  const ev = [
    isMon ? {t: "06:45", b: "hoc", ten: "Học từ khóa", pos: "dn2"} : null,
    {t: "05:13", b: "thu", ten: "Thu tin sáng", pos: "up", ok: ran(313, 287), span: 287},
    {t: "08:05", b: "ai", ten: "AI biên tập", pos: "dn", ok: !!q.co_ket_qua},
    {t: "08:52", b: "ghep", ten: "Ghép dự phòng", pos: "up2", ok: !!q.da_ghep, wait: !q.da_ghep && !q.co_ket_qua},
    {t: "09:22", b: "gac", ten: "Giám sát", pos: "dn2"},
    {t: "14:13", b: "thu", ten: "Thu tin chiều", pos: "up", ok: ran(853)},
    {t: "19:13", b: "thu", ten: "Thu tin tối", pos: "up", ok: ran(1153)},
  ].filter(Boolean).map(e => { const [h, m] = e.t.split(":").map(Number); return {...e, min: h * 60 + m}; });
  const A = 300, B = 1260, x = m => ((Math.min(Math.max(m, A), B) - A) / (B - A) * 100).toFixed(2) + "%";
  // ghép không có gì để làm khi AI chưa nộp kết quả: báo "chờ AI", lỗi nằm ở khâu AI chứ không ở khâu ghép
  const state = e => nowMin == null ? "" : nowMin < e.min ? "" : e.ok === undefined ? "done" : e.ok ? "done" : e.wait ? "wait" : nowMin > e.min + (e.span || 150) ? "miss" : "";
  const label = e => { const s = state(e); return s === "done" ? "xong" : s === "miss" ? "chưa chạy" : s === "wait" ? "chờ AI" : nowMin != null && nowMin < e.min ? "sắp tới" : "đang đợi"; };
  const track = `<div class="tl" aria-hidden="true"><div class="tl-line"></div>${nowMin != null ? `<div class="tl-past" style="width:${x(nowMin)}"></div>` : ""}
    ${[5, 9, 12, 15, 18, 21].map(h => `<span class="tl-hr" style="left:${x(h * 60)}">${String(h).padStart(2, "0")}:00</span>`).join("")}
    ${ev.map(e => `<div class="tl-ev ${e.pos} ${state(e)}" style="left:${x(e.min)};--c:${BOT[e.b].mau}"><i>${state(e) === "done" ? "✓" : state(e) === "miss" ? "!" : ""}</i><span>${esc(e.ten)}<small>${e.t}</small></span></div>`).join("")}
    ${nowMin != null && nowMin >= A && nowMin <= B ? `<div class="tl-now" style="left:${x(nowMin)}"><b>${String(p.h).padStart(2, "0")}:${String(p.mi).padStart(2, "0")}</b></div>` : ""}</div>`;
  const list = `<ul class="tl-list">${ev.map(e => `<li style="--c:${BOT[e.b].mau}"><span class="t">${e.t}</span><span class="d"></span><span>${esc(e.ten)}</span><span class="s">${pill(state(e) === "done" ? "good" : state(e) === "miss" ? "crit" : state(e) === "wait" ? "warn" : "line", label(e))}</span></li>`).join("")}</ul>`;
  return card("Lịch trong ngày", `Giờ Việt Nam · ${vnDate(T)}${nowMin == null ? " (dữ liệu chưa sang ngày hôm nay)" : ""}`, track + list);
}
function roomLog(){

function roomStates(){
  const real = botStates();

function runDemo(){
  stopDemo(true);

function applyRoom(){
  if(!D || S.tab !== "phong-may" || !ROOM || !$id("rm-walk")) return;
  const st = roomStates();
  for(const b of BOTS){
    const x = st[b.id], r = ROOM.bots[b.id];
    r.want = {loc: locOf(x.s), s: x.s};
    if(!r.busy){
      if(r.loc !== r.want.loc) drive(b.id);
      else if(r.s !== x.s){ r.s = x.s; place(b.id, r.loc, x.s); }
    }

}

function mhSua(key, patch){
  const [ai, viec] = key.split(":");

  if(moi.mo_hinh === cu.mo_hinh && moi.suy_luan === cu.suy_luan && !moi.khac) delete S.mh.sua[key];
  else S.mh.sua[key] = moi;

  const chon = {};

const KEEP = {bv: ["q", "trang", "wq"], goi: ["q", "nhom", "bai", "tt", "gap", "days"], vb: ["sub", "q", "nhom", "tt"], dt: ["days", "unit", "lv", "q"],
              kho: ["q", "lv", "cd", "dang", "loai", "nguon", "luong"], ai: ["sub", "ma", "tt", "q", "src", "srcSt"]};
function saveState(){
  const o = {tab: S.tab, range: S.range, ov: S.ov};
  for(const [k, f] of Object.entries(KEEP)) o[k] = Object.fromEntries(f.map(x => [x, S[k][x]]));

function loadState(){
  let o = null;

  if(!o) return null;
  if(o.range) S.range = o.range;
  if(o.ov) S.ov = o.ov;
  for(const [k, f] of Object.entries(KEEP)) if(o[k]) f.forEach(x => { if(x in o[k]) S[k][x] = o[k][x]; });
  return o.tab;

function showTip(el, x, y){

    if(c){ const i = document.createElement("i"); i.style.background = c; r.append(i); }
    const b = document.createElement("b"); b.textContent = v; const s = document.createElement("span"); s.textContent = k; r.append(b, s); tip.append(r); });
  if(d.f){ const f = document.createElement("div"); f.className = "tf"; f.textContent = d.f; tip.append(f); }
  tip.hidden = false;
  const w = tip.offsetWidth, hh = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 14)) + "px";

}

  const add = (g, icon, title, sub, run) => out.push({g, icon, title, sub, run});
  NAV.forEach(([id, t, i, grp], k) => { if(hit(t + " " + grp)) add("Đi tới", i, t, grp + " · phím " + (k + 1), () => go(id)); });
  const acts = [D.repo && ["scan", "Quét ngay", "Chạy một lượt thu tin", () => document.getElementById("scan-now").click()],
                D.repo && ["ai", "Gọi AI ngay", "AI biên tập các việc đang chờ", () => document.getElementById("ai-now").click()],
                ["moon", "Đổi nền sáng, tối", "Giao diện", toggleTheme], ["kbd", "Phím tắt", "Xem các phím tắt", () => openPalette("keys")],
                ["out", "Đăng xuất", ME ? ME + " · xóa mật khẩu khỏi phiên này" : "Xóa mật khẩu khỏi phiên này", logout]].filter(Boolean);
  acts.forEach(([i, t, s, run]) => { if(hit(t + " " + s)) add("Thao tác", i, t, s, run); });
  if(!words.length || words.join("").length < 2) return out;
  const items = D.items.filter(it => hit(it.tieu_de + " " + (it.so_hieu || []).join(" ") + " " + (it.y_tuong ? it.y_tuong.tieu_de_web : "") + " " + it.nguon))
    .sort((a, b) => (b.de_xuat_viet ? 1 : 0) - (a.de_xuat_viet ? 1 : 0) || b.ngay_thu.localeCompare(a.ngay_thu) || byHeat(a, b));
  items.slice(0, 8).forEach(it => add(it.loai === "van_ban" ? "Văn bản" : "Tin", it.loai === "van_ban" ? "doc" : it.de_xuat_viet ? "pen" : "box",
    it.tieu_de, [(it.so_hieu || []).join(", "), it.nguon, dm(it.ngay_thu), it.de_xuat_viet && live(it) ? "đề xuất viết" : ""].filter(Boolean).join(" · "),
    () => it.de_xuat_viet && live(it) ? pickIdea(it.id) : openDrawer("item", it.id)));
  (D.bai_viet || []).filter(b => hit(bvTitle(b) + " bài viết #" + b.issue)).slice(0, 5).forEach(b => add("Bài viết", "bai", bvTitle(b),
    "#" + b.issue + " · " + (BV_TT[b.trang_thai] || ["", b.trang_thai])[1], () => { S.bv = {...S.bv, q: "", sel: b.issue, closed: false, qd: null}; go("bai-viet"); }));
  (D.nguon || []).filter(s => hit(s.ten + " " + s.id)).slice(0, 4).forEach(s => add("Nguồn", "cpu", s.ten,
    (SRC_ST[srcState(s)] || ["", srcState(s)])[1] + (s.tang ? " · tầng " + s.tang : ""), () => openDrawer("src", s.id)));
  (D.doi_thu || []).filter(p => hit(p.tieu_de + " " + (p.don_vi_ten || ""))).slice(0, 4).forEach(p => add("Bài đối thủ", "eye", p.tieu_de,
    (p.don_vi_ten || "") + " · " + dm(p.ngay_dang || p.ngay_thu) + " · mở trang đối thủ", () => window.open(safeUrl(p.url), "_blank", "noopener,noreferrer")));
  return out;
}
function openPalette(mode){
  closeSheet();
  const root = document.getElementById("pal-root");
  PAL = {sel: 0, opts: [], from: document.activeElement};
  if(mode === "keys"){
    root.innerHTML = `<div class="pal-bg"><div class="pal" role="dialog" aria-modal="true" aria-label="Phím tắt"><div class="pal-in">${ic("kbd")}<b style="flex:1;padding:15px 0">Phím tắt</b><button class="icon-btn" type="button" data-pal-x aria-label="Đóng">✕</button></div>
      <div class="keys">${KEYS.map(([k, t]) => `<span class="kbd">${esc(k)}</span><span>${esc(t)}</span>`).join("")}</div></div></div>`;
    root.querySelector("[data-pal-x]").addEventListener("click", closePalette);
    root.querySelector("[data-pal-x]").focus();
    return;
  }
  root.innerHTML = `<div class="pal-bg"><div class="pal" role="dialog" aria-modal="true" aria-label="Tìm nhanh">
    <div class="pal-in">${ic("search")}<input id="pal-q" type="search" placeholder="Tìm tin, số hiệu văn bản, nguồn, mục…" autocomplete="off" aria-controls="pal-r" aria-label="Tìm nhanh"><span class="kbd">Esc</span></div>
    <div class="pal-r" id="pal-r" role="listbox"></div>
    <div class="pal-f"><span><span class="kbd">↑</span><span class="kbd">↓</span> chọn</span><span><span class="kbd">Enter</span> mở</span><span>Gõ có dấu hay không dấu đều được</span></div></div></div>`;
  const inp = document.getElementById("pal-q");
  inp.addEventListener("input", palResults);
  inp.addEventListener("keydown", e => {
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); palMove(e.key === "ArrowDown" ? 1 : -1); }
    else if(e.key === "Enter"){ e.preventDefault(); runPalette(PAL.sel); }
  });
  palResults(); inp.focus();
}
function palResults(){
  if(!PAL) return;
  const q = (document.getElementById("pal-q") || {}).value || "";
  PAL.opts = palOptions(q); PAL.sel = 0;
  let g = "";
  document.getElementById("pal-r").innerHTML = PAL.opts.length ? PAL.opts.map((o, i) => (o.g !== g ? `<div class="pal-g">${esc(g = o.g)}</div>` : "")
    + `<button class="pal-o" type="button" role="option" data-po="${i}" aria-selected="${i === 0}">${ic(o.icon)}<span class="m"><b>${esc(o.title)}</b>${o.sub ? `<span>${esc(o.sub)}</span>` : ""}</span></button>`).join("")
    : empty(fold(q).trim().length < 2 ? "Gõ ít nhất 2 ký tự để tìm trong tin, văn bản, nguồn." : "Không tìm thấy gì khớp “" + q.trim() + "”.", "search");
}
function palMove(d){
  if(!PAL || !PAL.opts.length) return;
  PAL.sel = (PAL.sel + d + PAL.opts.length) % PAL.opts.length;
  document.querySelectorAll(".pal-o").forEach(b => b.setAttribute("aria-selected", String(+b.dataset.po === PAL.sel)));
  const cur = document.querySelector(`.pal-o[data-po="${PAL.sel}"]`); if(cur) cur.scrollIntoView({block: "nearest"});
}
function runPalette(i){
  const o = PAL && PAL.opts[i];
  if(!o) return;
  PAL.from = null; closePalette(); o.run();
}
function closePalette(){
  if(!PAL) return;
  const from = PAL.from; PAL = null;
  document.getElementById("pal-root").innerHTML = "";
  if(from && document.body.contains(from) && from.focus) from.focus();
}

// ---------- kính: ánh phản chiếu theo con trỏ (chỉ thiết bị có chuột; CSS đọc --mx, --my) ----------
if(matchMedia("(hover: hover) and (pointer: fine)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches){
  document.addEventListener("pointermove", e => {
    const el = e.target.closest && e.target.closest(".btn,.icon-btn,.sug,.kpi,.bcard,.card:not(.detail)");
    if(!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty("--mx", (e.clientX - r.left) + "px"); el.style.setProperty("--my", (e.clientY - r.top) + "px");
  }, {passive: true});
}

// ---------- lượt đang chạy: live.json do workflow đẩy lên (scripts/live.sh, scripts/build.py) ----------
const LIVE_LUONG = {collect: "Lượt thu tin", merge: "Lượt ghép kết quả AI", publish: "Lượt xuất bản", "goi-ai": "Lượt gọi AI"};
const LIVE_STALE = 45 * 60e3;   // "đang chạy" mà 45 phút không cập nhật: workflow đã chết giữa chừng, không hiện nữa
let LIVE = null;
const runUrl = id => D.repo && /^\d+$/.test(id || "") ? `https://github.com/${D.repo}/actions/runs/${id}` : "";
const scanUrl = () => `https://github.com/${D.repo}/actions/workflows/collect.yml`;
const aiUrl = () => `https://github.com/${D.repo}/actions/workflows/goi-ai.yml`;
const ago = iso => { const m = Math.round((Date.now() - Date.parse(iso)) / 60e3); return m < 1 ? "vừa xong" : m < 60 ? m + " phút trước" : hm(iso) + " · " + dm(iso); };
function renderLive(){
  const el = document.getElementById("live"), btn = document.getElementById("scan-now"), L = LIVE || {};
  const fresh = h => L.cap_nhat && Date.now() - Date.parse(L.cap_nhat) < h;
  const running = L.trang_thai === "dang_chay" && fresh(LIVE_STALE), url = runUrl(L.run_id);
  btn.hidden = !D.repo;
  btn.href = running && url ? url : scanUrl();
  btn.lastElementChild.textContent = running ? "Đang quét…" : "Quét ngay";
  // đang chạy thì bấm chỉ mở trang lượt đang chạy, không gửi thêm lệnh
  btn.dataset.busy = running ? "1" : "";
  btn.title = D.lenh_token ? "Bấm để chạy một lượt thu tin ngay" : "Mở GitHub Actions; bấm Run workflow để chạy một lượt thu tin";
  // gọi AI xong thì AI còn biên tập 5–15 phút trong phiên Claude; máy tự ghép, xuất bản khi AI nộp kết quả
  const aiBtn = document.getElementById("ai-now"), called = L.trang_thai === "da_goi_ai" && fresh(30 * 60e3);
  aiBtn.hidden = !D.repo;
  aiBtn.href = aiUrl();
  aiBtn.lastElementChild.textContent = called || (running && L.luong === "goi-ai") ? "AI đang làm…" : "Gọi AI ngay";
  aiBtn.dataset.busy = called || (running && L.luong === "goi-ai") ? "1" : "";
  aiBtn.title = D.lenh_token ? "Bấm để AI biên tập ngay các việc đang chờ" : "Mở GitHub Actions; bấm Run workflow để AI biên tập ngay các việc đang chờ";
  const link = url ? '<span class="sp"></span>' + ext(url, "Xem trên GitHub", "btn ghost") : "";
  let cls = "", html = "";
  if(running){
    cls = "info";
    html = `<span class="pulse"></span>${L.buoc === "Gọi AI" ? whoAi(aiWho()) : who("bot")}<span><b>${esc(LIVE_LUONG[L.luong] || "Lượt chạy")} đang chạy</b> · ${esc(L.buoc)} · bắt đầu ${esc(hm(L.bat_dau || L.cap_nhat))}</span>${link}`;
  } else if(called){
    cls = "info";
    html = `<span class="pulse"></span><span><b>Đã gọi AI</b> lúc ${esc(hm(L.cap_nhat))} · AI đang biên tập các việc đang chờ, thường 5–15 phút; máy tự ghép và xuất bản khi AI nộp kết quả</span>${link}`;
  } else if(L.trang_thai === "loi" && fresh(12 * 36e5)){
    cls = "crit";
    html = `<span><b>${esc(LIVE_LUONG[L.luong] || "Lượt chạy")} dừng giữa chừng</b> · ở bước ${esc(L.buoc)} · ${esc(ago(L.cap_nhat))}</span>${link}`;
  } else if(L.tao_luc && L.tao_luc > D.tao_luc){
    cls = "good";
    html = `<span><b>Có bản mới</b> · cập nhật ${esc(hm(L.tao_luc))} · ${esc(dm(L.tao_luc))}</span><span class="sp"></span><button class="btn primary" type="button" id="live-reload">Tải lại</button>`;
  }
  // Lượt ChatGPT đối chiếu chạy song song (live.json, mục khe.doi_chieu): một dòng riêng
  const K = (L.khe || {}).doi_chieu || {}, kAge = minsAgo(K.cap_nhat), kUrl = runUrl(K.run_id);
  const kLine = K.trang_thai === "dang_chay" && kAge < 45 ? `<span class="pulse"></span>${who("gpt")}<span><b>ChatGPT đối chiếu đang chạy</b> · ${esc(K.buoc)} · bắt đầu ${esc(hm(K.bat_dau || K.cap_nhat))}</span>`
    : K.trang_thai === "loi" && kAge < 12 * 60 ? `${who("gpt")}<span><b>ChatGPT đối chiếu dừng giữa chừng</b> · ${esc(ago(K.cap_nhat))}</span>` : "";
  if(kLine){
    const kLink = kUrl ? '<span class="sp"></span>' + ext(kUrl, "Xem trên GitHub", "btn ghost") : "";
    html = html ? html + '<span style="flex-basis:100%;height:0"></span>' + kLine + kLink : kLine + kLink;
    if(!cls) cls = K.trang_thai === "loi" ? "crit" : "info";
  }
  el.className = "live " + cls; el.innerHTML = html; el.hidden = !html;
  const r = document.getElementById("live-reload");
  if(r) r.addEventListener("click", () => location.reload());
}
async function pollLive(){
  clearTimeout(pollLive.t);
  if(!document.hidden){
    try { const res = await fetch("live.json?t=" + Date.now(), {cache: "no-store"}); if(res.ok){ LIVE = await res.json(); renderLive(); refreshRoom(); refreshFlow(); } }
    catch(e) {}
  }
  const dcRun = LIVE && ((LIVE.khe || {}).doi_chieu || {}).trang_thai === "dang_chay";
  pollLive.t = setTimeout(pollLive, LIVE && (LIVE.trang_thai === "dang_chay" || dcRun) ? 15e3 : 60e3);
}
document.addEventListener("visibilitychange", () => { if(!document.hidden && D) pollLive(); });

async function open(pw){
  D = await unlock(pw);
  ME = D._ten; delete D._ten;
  NK = D.nhat_ky || {luot: [], loc: [], ai: [], yeu_cau: {}, hang_doi_toi_da: 60, phan_luong: {}};
  BOT.ai.ten = aiWho() === "gpt" ? "ChatGPT Biên tập" : aiWho() === "chia" ? "AI Biên tập (chia việc)" : "AI Biên tập";
  let saved = null;
  try { sessionStorage.setItem("radar-pw", pw); saved = sessionStorage.getItem("radar-tab"); } catch(e) {}
  saved = loadState() || saved;
  const h = OLD_TAB[location.hash.slice(1)] || location.hash.slice(1);
  S.tab = VIEWS[h] ? h : VIEWS[saved] ? saved : "tong-quan";
  document.getElementById("date").textContent = WD[wdOf(D.ngay)] + ", " + vnDate(D.ngay);
  const stamp = () => { document.getElementById("stamp").innerHTML = freshness(); };
  stamp(); setInterval(stamp, 60e3);
  document.getElementById("edit-state").innerHTML = editedToday() ? pill("good", "Đã qua AI biên tập") : pill("warn", "Chưa biên tập");
  const last = (NK.luot || [])[0];
  document.getElementById("side-foot").innerHTML = `${ME ? `<div class="row"><span>Đăng nhập: <b>${esc(ME)}</b></span></div>` : ""}<div class="row">${ic("cpu")}<span>Lượt quét gần nhất ${last ? hm(last.luot) + " · " + dm(last.ngay) : "–"}</span></div>
    <div class="row"><span>Lịch: thu tin 05:13, 14:13, 19:13 · AI ngay sau thu tin sáng (dự phòng 08:05) · giám sát 09:22</span></div>
    <div class="row"><button class="mini-btn" type="button" data-pal-keys style="padding:2px 7px">${ic("kbd", 13)} Phím tắt <span class="kbd" style="margin-left:4px">?</span></button></div>`;
  document.getElementById("login").hidden = true;
  document.getElementById("app").hidden = false;
  go(S.tab, false);
  renderLive();
  pollLive();
}

document.getElementById("login").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err"), btn = document.getElementById("go");
  err.textContent = ""; err.classList.remove("shake");
  btn.setAttribute("aria-busy", "true"); btn.textContent = "Đang giải mã…";
  try { await open(document.getElementById("pw").value); }
  catch(x){ err.textContent = x.message; void err.offsetWidth; err.classList.add("shake"); document.getElementById("pw").select(); }
  finally { btn.removeAttribute("aria-busy"); btn.textContent = "Mở dashboard"; }
});
document.getElementById("pw-eye").addEventListener("click", e => {
  const pw = document.getElementById("pw"), show = pw.type === "password";
  pw.type = show ? "text" : "password";
  e.currentTarget.setAttribute("aria-pressed", String(show));
  e.currentTarget.setAttribute("aria-label", show ? "Ẩn mật khẩu" : "Hiện mật khẩu");
  pw.focus();
});

(async () => {
  let t = null;
  try { t = localStorage.getItem("radar-theme"); } catch(e) {}
  setTheme(t === "light" || t === "dark" ? t : null);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if(!document.documentElement.dataset.theme) setTheme(null); if(D) drawCharts(); });
  let pw = null;
  try { pw = sessionStorage.getItem("radar-pw"); } catch(e) {}
  if(pw){ try { await open(pw); } catch(e) { try { sessionStorage.removeItem("radar-pw"); } catch(_) {} } }
})();
